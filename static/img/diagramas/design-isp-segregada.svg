<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Diagrama: três contratos coesos — QRCodeGenerable, PaymentMethod e DocumentGenerable — e cada cliente depende apenas da capacidade que usa">
  <title>Interfaces segregadas</title>
  <desc>Pix implementa PaymentMethod e QRCodeGenerable; Boleto implementa PaymentMethod e DocumentGenerable; CreditCard só PaymentMethod. Cada cliente pede a capacidade que usa.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .port{fill:none;stroke:#238636;stroke-width:2;stroke-dasharray:6 4}
    .detail{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .bad{fill:none;stroke:#cf222e;stroke-width:2}
    .badlbl{fill:#cf222e}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .port{stroke:#3fb950}
      .detail{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .bad{stroke:#f85149}
      .badlbl{fill:#f85149}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="20" y="26" font-size="12" text-anchor="start" class="lbl" font-weight="bold">Contratos coesos — cada cliente depende só da capacidade que usa</text>
  <rect x="40" y="48" width="240" height="54" rx="8" class="box"/>
  <text x="160" y="73" font-size="13" text-anchor="middle">Tela Pix</text>
  <text x="160" y="90" font-size="11" text-anchor="middle" class="mono">cliente</text>
  <rect x="330" y="48" width="240" height="54" rx="8" class="box"/>
  <text x="450" y="73" font-size="13" text-anchor="middle">Checkout</text>
  <text x="450" y="90" font-size="11" text-anchor="middle" class="mono">cliente</text>
  <rect x="620" y="48" width="240" height="54" rx="8" class="box"/>
  <text x="740" y="73" font-size="13" text-anchor="middle">E-mail boleto</text>
  <text x="740" y="90" font-size="11" text-anchor="middle" class="mono">cliente</text>
  <rect x="40" y="170" width="240" height="66" rx="8" class="port"/>
  <text x="160" y="201" font-size="13" text-anchor="middle">QRCodeGenerable</text>
  <text x="160" y="218" font-size="11" text-anchor="middle" class="mono">GenerateQRCode</text>
  <rect x="330" y="170" width="240" height="66" rx="8" class="port"/>
  <text x="450" y="201" font-size="13" text-anchor="middle">PaymentMethod</text>
  <text x="450" y="218" font-size="11" text-anchor="middle" class="mono">Pay</text>
  <rect x="620" y="170" width="240" height="66" rx="8" class="port"/>
  <text x="740" y="201" font-size="13" text-anchor="middle">DocumentGenerable</text>
  <text x="740" y="218" font-size="11" text-anchor="middle" class="mono">GenerateDocument</text>
  <rect x="40" y="300" width="240" height="64" rx="8" class="detail"/>
  <text x="160" y="330" font-size="13" text-anchor="middle">Pix</text>
  <text x="160" y="347" font-size="11" text-anchor="middle" class="mono">paga + QR Code</text>
  <rect x="330" y="300" width="240" height="64" rx="8" class="detail"/>
  <text x="450" y="330" font-size="13" text-anchor="middle">CreditCard</text>
  <text x="450" y="347" font-size="11" text-anchor="middle" class="mono">só paga</text>
  <rect x="620" y="300" width="240" height="64" rx="8" class="detail"/>
  <text x="740" y="330" font-size="13" text-anchor="middle">Boleto</text>
  <text x="740" y="347" font-size="11" text-anchor="middle" class="mono">paga + documento</text>
  <path d="M 160 102 L 160 170" class="flow" marker-end="url(#arrow)"/>
  <path d="M 450 102 L 450 170" class="flow" marker-end="url(#arrow)"/>
  <path d="M 740 102 L 740 170" class="flow" marker-end="url(#arrow)"/>
  <text x="300" y="142" font-size="11" text-anchor="middle" class="lbl">usa</text>
  <path d="M 160 300 L 160 236" class="flow" marker-end="url(#arrow)"/>
  <path d="M 230 300 L 380 236" class="flow" marker-end="url(#arrow)"/>
  <path d="M 450 300 L 450 236" class="flow" marker-end="url(#arrow)"/>
  <path d="M 670 300 L 520 236" class="flow" marker-end="url(#arrow)"/>
  <path d="M 740 300 L 740 236" class="flow" marker-end="url(#arrow)"/>
  <text x="300" y="272" font-size="11" text-anchor="middle" class="lbl">implementa</text>
  <text x="20" y="390" font-size="11" text-anchor="start" class="lbl">CreditCard depende só de PaymentMethod — sem métodos mortos.</text>
</svg>
