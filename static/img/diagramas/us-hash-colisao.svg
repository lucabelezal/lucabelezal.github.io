<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" role="img" aria-label="Fluxograma: hash com resolução de colisão, reaplicando o hash com um prefixo até não haver colisão">
  <title>Hash com resolução de colisão</title>
  <desc>Aplica o hash, checa se a URL curta já existe no banco; se existir, acrescenta um prefixo à URL longa e repete; se não, salva.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .store{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .store{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="18" y="22" font-size="11" text-anchor="start" class="lbl">Hash + resolução de colisão</text>
  <rect x="110" y="40" width="100" height="34" rx="17" class="proc"/>
  <text x="160" y="61" font-size="12" text-anchor="middle">início</text>
  <rect x="40" y="96" width="240" height="46" rx="8" class="box"/>
  <text x="160" y="123" font-size="12" text-anchor="middle">entrada: URL longa</text>
  <rect x="40" y="174" width="240" height="46" rx="8" class="proc"/>
  <text x="160" y="195" font-size="12" text-anchor="middle">função de hash</text>
  <text x="160" y="212" font-size="10" text-anchor="middle" class="mono">7 primeiros caracteres</text>
  <rect x="40" y="252" width="240" height="46" rx="8" class="store"/>
  <text x="160" y="279" font-size="12" text-anchor="middle">URL curta</text>
  <polygon points="160,322 280,360 160,398 40,360" class="proc"/>
  <text x="160" y="364" font-size="12" text-anchor="middle">existe no DB?</text>
  <rect x="40" y="432" width="240" height="46" rx="8" class="store"/>
  <text x="160" y="459" font-size="12" text-anchor="middle">salva no DB</text>
  <rect x="110" y="500" width="100" height="34" rx="17" class="proc"/>
  <text x="160" y="521" font-size="12" text-anchor="middle">fim</text>
  <rect x="400" y="337" width="260" height="46" rx="8" class="proc"/>
  <text x="530" y="364" font-size="12" text-anchor="middle">URL longa + prefixo</text>
  <path d="M 160 74 L 160 96" class="flow" marker-end="url(#arrow)"/>
  <path d="M 160 142 L 160 174" class="flow" marker-end="url(#arrow)"/>
  <path d="M 160 220 L 160 252" class="flow" marker-end="url(#arrow)"/>
  <path d="M 160 298 L 160 322" class="flow" marker-end="url(#arrow)"/>
  <path d="M 160 398 L 160 432" class="flow" marker-end="url(#arrow)"/>
  <text x="172" y="418" font-size="11" text-anchor="start" class="lbl">não</text>
  <path d="M 160 478 L 160 500" class="flow" marker-end="url(#arrow)"/>
  <path d="M 280 360 L 400 360" class="flow" marker-end="url(#arrow)"/>
  <text x="300" y="352" font-size="11" text-anchor="start" class="lbl">sim</text>
  <path d="M 530 337 L 530 197 L 280 197" class="flow" marker-end="url(#arrow)"/>
  <text x="392" y="189" font-size="10" text-anchor="middle" class="lbl">re-hash</text>
</svg>
