<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Diagrama: os três grupos de serviços AWS — computação, dados e objetos, comunicação">
  <title>Os três grupos de serviços AWS</title>
  <desc>Computação (EC2, ECS e Fargate, Lambda); dados e objetos (RDS, DynamoDB, S3); comunicação (API Gateway, SQS, SNS e EventBridge).</desc>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .databox{fill:none;stroke:#d29922;stroke-width:2}
    .commbox{fill:none;stroke:#8957e5;stroke-width:2}
    .lbl{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .databox{stroke:#e3b341}
      .commbox{stroke:#a371f7}
      .lbl{fill:#8b949e}
    }
  </style>
  <text x="18" y="22" font-size="13" class="lbl">Nuvem: alugar infraestrutura sob demanda</text>

  <rect x="18" y="40" width="232" height="236" rx="10" class="box"/>
  <text x="34" y="68" font-size="14" font-weight="bold">Computação</text>
  <rect x="34" y="88" width="200" height="38" rx="8" class="box"/>
  <text x="46" y="112" font-size="12">EC2 · servidor</text>
  <rect x="34" y="138" width="200" height="38" rx="8" class="box"/>
  <text x="46" y="162" font-size="12">ECS + Fargate · contêiner</text>
  <rect x="34" y="188" width="200" height="38" rx="8" class="box"/>
  <text x="46" y="212" font-size="12">Lambda · função</text>

  <rect x="262" y="40" width="232" height="236" rx="10" class="databox"/>
  <text x="278" y="68" font-size="14" font-weight="bold">Dados e objetos</text>
  <rect x="278" y="88" width="200" height="38" rx="8" class="databox"/>
  <text x="290" y="112" font-size="12">RDS · SQL</text>
  <rect x="278" y="138" width="200" height="38" rx="8" class="databox"/>
  <text x="290" y="162" font-size="12">DynamoDB · NoSQL</text>
  <rect x="278" y="188" width="200" height="38" rx="8" class="databox"/>
  <text x="290" y="212" font-size="12">S3 · arquivos</text>

  <rect x="506" y="40" width="232" height="236" rx="10" class="commbox"/>
  <text x="522" y="68" font-size="14" font-weight="bold">Comunicação</text>
  <rect x="522" y="88" width="200" height="38" rx="8" class="commbox"/>
  <text x="534" y="112" font-size="12">API Gateway · API</text>
  <rect x="522" y="138" width="200" height="38" rx="8" class="commbox"/>
  <text x="534" y="162" font-size="12">SQS · fila</text>
  <rect x="522" y="188" width="200" height="38" rx="8" class="commbox"/>
  <text x="534" y="212" font-size="12">SNS / EventBridge</text>
</svg>
