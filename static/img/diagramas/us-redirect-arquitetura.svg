<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-label="Diagrama: arquitetura do redirecionamento — cliente, balanceador, servidores web, cache e banco">
  <title>Arquitetura do redirecionamento</title>
  <desc>O cliente pede a URL curta; o balanceador distribui para servidores web sem estado; a leitura passa por um cache antes de chegar ao banco.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .store{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .store{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="18" y="22" font-size="11" text-anchor="start" class="lbl">Leitura em cache: mais leituras que escritas</text>
  <rect x="18" y="120" width="150" height="70" rx="8" class="box"/>
  <text x="93" y="153" font-size="12" text-anchor="middle">Cliente</text>
  <text x="93" y="170" font-size="10" text-anchor="middle" class="mono">laptop · mobile</text>
  <rect x="230" y="130" width="110" height="50" rx="8" class="proc"/>
  <text x="285" y="159" font-size="12" text-anchor="middle">Balanceador</text>
  <rect x="400" y="50" width="200" height="44" rx="8" class="proc"/>
  <text x="500" y="70" font-size="12" text-anchor="middle">Servidores web</text>
  <text x="500" y="87" font-size="10" text-anchor="middle" class="mono">sem estado</text>
  <rect x="660" y="44" width="180" height="66" rx="8" class="store"/>
  <text x="750" y="75" font-size="12" text-anchor="middle">Cache</text>
  <text x="750" y="92" font-size="10" text-anchor="middle" class="mono">Redis</text>
  <rect x="660" y="176" width="180" height="66" rx="8" class="store"/>
  <text x="750" y="207" font-size="12" text-anchor="middle">Banco</text>
  <text x="750" y="224" font-size="10" text-anchor="middle" class="mono">curta → longa</text>
  <path d="M 168 155 L 230 155" class="flow" marker-end="url(#arrow)"/>
  <text x="199" y="147" font-size="10" text-anchor="middle" class="lbl">1 GET</text>
  <path d="M 340 145 L 400 72" class="flow" marker-end="url(#arrow)"/>
  <text x="378" y="118" font-size="10" text-anchor="middle" class="lbl">2</text>
  <path d="M 600 72 L 660 72" class="flow" marker-end="url(#arrow)"/>
  <text x="630" y="64" font-size="10" text-anchor="middle" class="lbl">3 hit</text>
  <path d="M 750 110 L 750 176" class="flow" marker-end="url(#arrow)"/>
  <text x="760" y="148" font-size="10" text-anchor="start" class="lbl">4 miss</text>
  <path d="M 400 62 L 93 62 L 93 120" class="flow" marker-end="url(#arrow)"/>
  <text x="246" y="54" font-size="10" text-anchor="middle" class="lbl">5 devolve a URL longa</text>
</svg>
