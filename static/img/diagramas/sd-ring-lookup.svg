<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" role="img" aria-label="Diagrama: anel de hash com servidores e chaves; a chave vai para o primeiro servidor no sentido horário">
  <title>Anel de hash e lookup</title>
  <desc>Servidores e chaves são mapeados no mesmo anel; a chave pertence ao primeiro servidor encontrado no sentido horário.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .store{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .ring{fill:none;stroke:#d0d7de;stroke-width:2}
    .keydot{fill:#57606a}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .store{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .ring{stroke:#30363d}
      .keydot{fill:#8b949e}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="18" y="22" font-size="11" text-anchor="start" class="lbl">Lookup: anda no sentido horário até o primeiro servidor</text>
  <circle cx="310" cy="200" r="130" class="ring"/>
  <path d="M 310 45 A 155 155 0 0 1 465 200" class="flow" marker-end="url(#arrow)"/>
  <text x="410" y="60" font-size="10" text-anchor="start" class="lbl">sentido horário</text>
  <circle cx="310" cy="70" r="22" class="proc"/>
  <text x="310" y="74" font-size="10" text-anchor="middle">s0</text>
  <circle cx="440" cy="200" r="22" class="proc"/>
  <text x="440" y="204" font-size="10" text-anchor="middle">s1</text>
  <circle cx="310" cy="330" r="22" class="proc"/>
  <text x="310" y="334" font-size="10" text-anchor="middle">s2</text>
  <circle cx="180" cy="200" r="22" class="proc"/>
  <text x="180" y="204" font-size="10" text-anchor="middle">s3</text>
  <circle cx="394" cy="100" r="5" class="keydot"/>
  <text x="403" y="104" font-size="10" class="lbl">k0</text>
  <circle cx="410" cy="284" r="5" class="keydot"/>
  <text x="419" y="288" font-size="10" class="lbl">k1</text>
  <circle cx="226" cy="300" r="5" class="keydot"/>
  <text x="235" y="304" font-size="10" class="lbl">k2</text>
  <circle cx="210" cy="116" r="5" class="keydot"/>
  <text x="219" y="120" font-size="10" class="lbl">k3</text>
  <path d="M 394 100 L 430 185" class="flow" marker-end="url(#arrow)"/>
  <path d="M 410 284 L 320 325" class="flow" marker-end="url(#arrow)"/>
  <path d="M 226 300 L 190 215" class="flow" marker-end="url(#arrow)"/>
  <path d="M 210 116 L 300 78" class="flow" marker-end="url(#arrow)"/>
</svg>
