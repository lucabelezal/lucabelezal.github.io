<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-label="Diagrama: injeção pelo construtor de uma classe concreta — o new mudou de lugar, mas o acoplamento permanece">
  <title>Tentativa ingênua</title>
  <desc>Injetar StripeClient pelo construtor move o new para o chamador, mas o serviço continua dependendo de uma classe concreta.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .port{fill:none;stroke:#238636;stroke-width:2;stroke-dasharray:6 4}
    .detail{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .bad{fill:none;stroke:#cf222e;stroke-width:2}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .port{stroke:#3fb950}
      .detail{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .bad{stroke:#f85149}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="18" y="24" font-size="11" text-anchor="start" class="lbl" font-weight="bold">new mudou de lugar; o acoplamento continua</text>
  <rect x="30" y="90" width="180" height="64" rx="8" class="box"/>
  <text x="120" y="120" font-size="12" text-anchor="middle">Controller</text>
  <text x="120" y="137" font-size="10" text-anchor="middle" class="mono">chamador</text>
  <rect x="300" y="90" width="250" height="64" rx="8" class="proc"/>
  <text x="425" y="120" font-size="12" text-anchor="middle">OrderProcessorService</text>
  <text x="425" y="137" font-size="10" text-anchor="middle" class="mono">depende de concreto</text>
  <rect x="640" y="90" width="160" height="64" rx="8" class="detail"/>
  <text x="720" y="120" font-size="12" text-anchor="middle">StripeClient</text>
  <text x="720" y="137" font-size="10" text-anchor="middle" class="mono">concreto</text>
  <path d="M 210 122 L 300 122" class="flow" marker-end="url(#arrow)"/>
  <path d="M 550 122 L 640 122" class="bad" marker-end="url(#arrow)"/>
  <text x="475" y="114" font-size="10" text-anchor="middle" class="lbl">StripeClient</text>
  <text x="255" y="82" font-size="10" text-anchor="middle" class="lbl">injeta</text>
  <text x="30" y="205" font-size="10" text-anchor="start" class="lbl">Ainda depende de uma classe concreta e volátil.</text>
</svg>
