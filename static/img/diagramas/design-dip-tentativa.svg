<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" role="img" aria-label="Diagrama: injeção pelo construtor de uma classe concreta — o new mudou de lugar, mas o acoplamento permanece">
  <title>Tentativa ingênua</title>
  <desc>Injetar StripeClient pelo construtor move o new para o chamador, mas o serviço continua dependendo de uma classe concreta.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .port{fill:none;stroke:#238636;stroke-width:2;stroke-dasharray:6 4}
    .detail{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .bad{fill:none;stroke:#cf222e;stroke-width:2}
    .badlbl{fill:#cf222e}
    .oklbl{fill:#238636}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .port{stroke:#3fb950}
      .detail{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .bad{stroke:#f85149}
      .badlbl{fill:#f85149}
      .oklbl{fill:#3fb950}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="20" y="26" font-size="12" text-anchor="start" class="lbl" font-weight="bold">new mudou de lugar; o acoplamento continua</text>
  <rect x="30" y="100" width="200" height="64" rx="8" class="box"/>
  <text x="130" y="130" font-size="13" text-anchor="middle">Controller</text>
  <text x="130" y="147" font-size="11" text-anchor="middle" class="mono">chamador</text>
  <rect x="310" y="100" width="260" height="64" rx="8" class="proc"/>
  <text x="440" y="130" font-size="13" text-anchor="middle">OrderProcessorService</text>
  <text x="440" y="147" font-size="11" text-anchor="middle" class="mono">depende de concreto</text>
  <rect x="650" y="100" width="180" height="64" rx="8" class="detail"/>
  <text x="740" y="130" font-size="13" text-anchor="middle">StripeClient</text>
  <text x="740" y="147" font-size="11" text-anchor="middle" class="mono">concreto</text>
  <path d="M 230 132 L 310 132" class="flow" marker-end="url(#arrow)"/>
  <path d="M 570 132 L 650 132" class="bad" marker-end="url(#arrow)"/>
  <text x="270" y="122" font-size="11" text-anchor="middle" class="lbl">injeta</text>
  <text x="610" y="122" font-size="11" text-anchor="middle" class="lbl">depende</text>
  <text x="20" y="250" font-size="11" text-anchor="start" class="lbl">Ainda depende de uma classe concreta e volátil.</text>
</svg>
