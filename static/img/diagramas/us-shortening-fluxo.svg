<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" role="img" aria-label="Fluxograma do encurtamento: verifica se a URL longa já existe, gera ID único, converte para base 62 e salva">
  <title>Fluxo de encurtamento da URL</title>
  <desc>Se a URL longa já existe, devolve a URL curta; senão gera um ID único, converte para base 62 e salva o novo registro.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .store{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .store{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="18" y="22" font-size="11" text-anchor="start" class="lbl">Encurtamento com base 62</text>
  <rect x="40" y="46" width="280" height="44" rx="8" class="box"/>
  <text x="180" y="72" font-size="12" text-anchor="middle">1. entrada: URL longa</text>
  <polygon points="180,120 300,158 180,196 60,158" class="proc"/>
  <text x="180" y="162" font-size="12" text-anchor="middle">2. URL longa no DB?</text>
  <rect x="400" y="136" width="270" height="44" rx="8" class="store"/>
  <text x="535" y="162" font-size="12" text-anchor="middle">3. devolve URL curta</text>
  <rect x="40" y="232" width="280" height="44" rx="8" class="proc"/>
  <text x="180" y="258" font-size="12" text-anchor="middle">4. gera ID único</text>
  <rect x="40" y="302" width="280" height="44" rx="8" class="proc"/>
  <text x="180" y="328" font-size="12" text-anchor="middle">5. converte ID para base 62</text>
  <rect x="40" y="372" width="280" height="44" rx="8" class="store"/>
  <text x="180" y="398" font-size="12" text-anchor="middle">6. salva ID, curta, longa</text>
  <rect x="130" y="442" width="100" height="34" rx="17" class="proc"/>
  <text x="180" y="463" font-size="12" text-anchor="middle">fim</text>
  <path d="M 180 90 L 180 120" class="flow" marker-end="url(#arrow)"/>
  <path d="M 300 158 L 400 158" class="flow" marker-end="url(#arrow)"/>
  <text x="320" y="150" font-size="11" text-anchor="start" class="lbl">sim</text>
  <path d="M 180 196 L 180 232" class="flow" marker-end="url(#arrow)"/>
  <text x="192" y="220" font-size="11" text-anchor="start" class="lbl">não</text>
  <path d="M 180 276 L 180 302" class="flow" marker-end="url(#arrow)"/>
  <path d="M 180 346 L 180 372" class="flow" marker-end="url(#arrow)"/>
  <path d="M 180 416 L 180 442" class="flow" marker-end="url(#arrow)"/>
</svg>
