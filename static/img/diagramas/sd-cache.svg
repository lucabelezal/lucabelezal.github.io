<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 210" role="img" aria-label="Diagrama: cache read-through — o servidor busca no cache e só vai ao banco no miss">
  <title>Cache read-through</title>
  <desc>O servidor consulta o cache; no acerto devolve direto; no miss busca no banco e popula o cache.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .store{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .ring{fill:none;stroke:#d0d7de;stroke-width:2}
    .keydot{fill:#57606a}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .store{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .ring{stroke:#30363d}
      .keydot{fill:#8b949e}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="18" y="22" font-size="11" text-anchor="start" class="lbl">Cache na frente do banco (read-through)</text>
  <rect x="40" y="80" width="180" height="60" rx="8" class="proc"/>
  <text x="130" y="114" font-size="12" text-anchor="middle">Servidor web</text>
  <rect x="330" y="60" width="180" height="50" rx="8" class="store"/>
  <text x="420" y="89" font-size="12" text-anchor="middle">Cache</text>
  <rect x="330" y="150" width="180" height="50" rx="8" class="store"/>
  <text x="420" y="179" font-size="12" text-anchor="middle">Banco</text>
  <path d="M 220 95 L 330 85" class="flow" marker-end="url(#arrow)"/>
  <text x="275" y="80" font-size="10" text-anchor="middle" class="lbl">1 busca</text>
  <path d="M 330 108 L 220 125" class="flow" marker-end="url(#arrow)"/>
  <text x="275" y="132" font-size="10" text-anchor="middle" class="lbl">hit: devolve</text>
  <path d="M 420 150 L 420 110" class="flow" marker-end="url(#arrow)"/>
  <text x="432" y="134" font-size="10" text-anchor="start" class="lbl">2.1 miss</text>
</svg>
