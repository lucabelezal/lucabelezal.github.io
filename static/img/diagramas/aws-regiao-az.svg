<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" role="img" aria-label="Diagrama: uma região com três zonas de disponibilidade e pontos de presença na borda">
  <title>Região, zonas de disponibilidade e borda</title>
  <desc>Uma região contém três zonas de disponibilidade isoladas; pontos de presença na borda entregam conteúdo perto do usuário; multi-AZ não protege contra a queda da região inteira.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .store{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .dash{fill:none;stroke:#57606a;stroke-width:1.4;stroke-dasharray:5 4}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    .title{fill:#24292f;font-weight:700}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .store{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .dash{stroke:#8b949e}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
      .title{fill:#e6edf3}
    }
  </style>
  <text x="18" y="24" font-size="13.75" text-anchor="start" class="lbl" font-weight="700">Região: várias AZs isoladas; borda: cópia perto do usuário</text>
  <rect x="18" y="44" width="560" height="196" rx="8" class="box"/>
  <text x="38" y="68" font-size="16.25" text-anchor="start" class="lbl" font-weight="700">Região sa-east-1 (São Paulo)</text>
  <rect x="40" y="88" width="150" height="130" rx="8" class="box"/>
  <text x="115" y="151" font-size="15" text-anchor="middle">AZ a</text>
  <text x="115" y="168" font-size="12.5" text-anchor="middle" class="mono">1+ data centers</text>
  <rect x="214" y="88" width="150" height="130" rx="8" class="box"/>
  <text x="289" y="151" font-size="15" text-anchor="middle">AZ b</text>
  <text x="289" y="168" font-size="12.5" text-anchor="middle" class="mono">1+ data centers</text>
  <rect x="388" y="88" width="150" height="130" rx="8" class="box"/>
  <text x="463" y="151" font-size="15" text-anchor="middle">AZ c</text>
  <text x="463" y="168" font-size="12.5" text-anchor="middle" class="mono">1+ data centers</text>
  <path d="M 202 98 L 202 208" class="dash"/>
  <path d="M 376 98 L 376 208" class="dash"/>
  <text x="298" y="234" font-size="12.5" text-anchor="middle" class="lbl">AZs isoladas entre si</text>
  <rect x="636" y="88" width="190" height="60" rx="8" class="proc"/>
  <text x="731" y="116" font-size="15" text-anchor="middle">Edge location</text>
  <text x="731" y="133" font-size="12.5" text-anchor="middle" class="mono">cache perto do usuário</text>
  <rect x="636" y="168" width="190" height="60" rx="8" class="proc"/>
  <text x="731" y="196" font-size="15" text-anchor="middle">Edge location</text>
  <text x="731" y="213" font-size="12.5" text-anchor="middle" class="mono">outra cidade</text>
  <path d="M 578 118 L 636 118" class="flow" marker-end="url(#arrow)"/>
  <path d="M 578 198 L 636 198" class="flow" marker-end="url(#arrow)"/>
  <text x="18" y="264" font-size="12.5" text-anchor="start" class="lbl">multi-AZ: sobrevive à queda de um data center. multi-região: sobrevive à queda da região.</text>
</svg>
