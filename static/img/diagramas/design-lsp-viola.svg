<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" role="img" aria-label="Diagrama: S3Generator devolve uma URL onde o contrato prometia um caminho local, quebrando o cliente e forçando checagem de tipo">
  <title>Substituição falha</title>
  <desc>CSV e PDF devolvem caminho local; S3 devolve URL. O cliente que confia no contrato quebra e é forçado a checar o tipo, perdendo o polimorfismo.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .port{fill:none;stroke:#238636;stroke-width:2;stroke-dasharray:6 4}
    .detail{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .bad{fill:none;stroke:#cf222e;stroke-width:2}
    .badlbl{fill:#cf222e}
    .oklbl{fill:#238636}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .port{stroke:#3fb950}
      .detail{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .bad{stroke:#f85149}
      .badlbl{fill:#f85149}
      .oklbl{fill:#3fb950}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="20" y="26" font-size="12" text-anchor="start" class="lbl" font-weight="bold">A assinatura é a mesma; o comportamento não</text>
  <rect x="30" y="132" width="190" height="64" rx="8" class="proc"/>
  <text x="125" y="162" font-size="13" text-anchor="middle">AttachToEmail</text>
  <text x="125" y="179" font-size="11" text-anchor="middle" class="mono">cliente</text>
  <rect x="290" y="132" width="230" height="64" rx="8" class="port"/>
  <text x="405" y="162" font-size="13" text-anchor="middle">ReportGenerator</text>
  <text x="405" y="179" font-size="11" text-anchor="middle" class="mono">Generate() string</text>
  <rect x="600" y="52" width="240" height="50" rx="8" class="detail"/>
  <text x="720" y="75" font-size="13" text-anchor="middle">CSVGenerator</text>
  <text x="720" y="92" font-size="11" text-anchor="middle" class="mono">→ caminho local</text>
  <rect x="600" y="138" width="240" height="50" rx="8" class="detail"/>
  <text x="720" y="161" font-size="13" text-anchor="middle">PDFGenerator</text>
  <text x="720" y="178" font-size="11" text-anchor="middle" class="mono">→ caminho local</text>
  <rect x="600" y="224" width="240" height="50" rx="8" class="detail"/>
  <text x="720" y="247" font-size="13" text-anchor="middle">S3Generator</text>
  <text x="720" y="264" font-size="11" text-anchor="middle" class="mono">→ URL (nuvem)</text>
  <path d="M 220 164 L 290 164" class="flow" marker-end="url(#arrow)"/>
  <text x="255" y="156" font-size="11" text-anchor="middle" class="lbl">usa</text>
  <path d="M 520 152 L 600 77" class="flow" marker-end="url(#arrow)"/>
  <path d="M 520 164 L 600 163" class="flow" marker-end="url(#arrow)"/>
  <path d="M 520 176 L 600 249" class="bad" marker-end="url(#arrow)"/>
  <text x="20" y="300" font-size="11" text-anchor="start" class="badlbl">URL não é caminho local: o cliente quebra e passa a checar o tipo — polimorfismo perdido.</text>
</svg>
