<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" role="img" aria-label="Diagrama: pasaje por valor vs por puntero">
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .goodbox{fill:none;stroke:#238636;stroke-width:2}
    .lbl{fill:#57606a}
    .goodtext{fill:#238636;font-weight:bold}
    .arrow{stroke:#0969da;stroke-width:2;fill:none}
    .head{fill:#0969da;stroke:none}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .goodbox{stroke:#3fb950}
      .lbl{fill:#8b949e}
      .goodtext{fill:#3fb950}
      .arrow{stroke:#58a6ff}
      .head{fill:#58a6ff}
    }
  </style>
  <defs>
    <marker id="ah2" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" class="head"/>
    </marker>
  </defs>
  <text x="20" y="80" font-size="14" class="lbl">por valor</text>
  <rect x="120" y="35" width="150" height="80" rx="10" class="box"/>
  <text x="136" y="66" font-size="16" font-weight="bold">main</text>
  <text x="136" y="92" font-size="15">x = 5</text>
  <line x1="275" y1="75" x2="445" y2="75" class="arrow" marker-end="url(#ah2)"/>
  <text x="360" y="58" font-size="13" text-anchor="middle">copia</text>
  <rect x="450" y="35" width="190" height="80" rx="10" class="box"/>
  <text x="466" y="66" font-size="16" font-weight="bold">increment</text>
  <text x="466" y="92" font-size="15">x = 5 → 6</text>
  <text x="466" y="140" font-size="14" class="lbl">main.x sigue en 5</text>
  <text x="20" y="235" font-size="14" class="lbl">por puntero</text>
  <rect x="120" y="190" width="150" height="80" rx="10" class="box"/>
  <text x="136" y="221" font-size="16" font-weight="bold">main</text>
  <text x="136" y="247" font-size="15">x = 5</text>
  <line x1="275" y1="230" x2="445" y2="230" class="arrow" marker-end="url(#ah2)"/>
  <text x="360" y="213" font-size="13" text-anchor="middle">copia del puntero</text>
  <rect x="450" y="190" width="190" height="80" rx="10" class="goodbox"/>
  <text x="466" y="221" font-size="16" font-weight="bold">*x++</text>
  <text x="466" y="247" font-size="15">alcanza el original</text>
  <text x="466" y="295" font-size="14" class="goodtext">main.x = 6</text>
</svg>
