<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" role="img" aria-label="Diagrama: função de hash mapeia a URL longa para um valor curto">
  <title>Função de hash</title>
  <desc>A URL longa entra na função f(x), que produz um valor de hash curto usado como URL encurtada.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .store{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .store{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="18" y="22" font-size="11" text-anchor="start" class="lbl">A função de hash precisa ser determinística e reversível</text>
  <rect x="18" y="58" width="210" height="64" rx="8" class="box"/>
  <text x="123" y="88" font-size="12" text-anchor="middle">URL longa</text>
  <text x="123" y="105" font-size="10" text-anchor="middle" class="mono">entrada</text>
  <rect x="310" y="58" width="130" height="64" rx="8" class="proc"/>
  <text x="375" y="88" font-size="12" text-anchor="middle">f(x)</text>
  <text x="375" y="105" font-size="10" text-anchor="middle" class="mono">hash</text>
  <rect x="520" y="58" width="222" height="64" rx="8" class="store"/>
  <text x="631" y="88" font-size="12" text-anchor="middle">URL curta</text>
  <text x="631" y="105" font-size="10" text-anchor="middle" class="mono">tinyurl.com/{hash}</text>
  <path d="M 228 90 L 310 90" class="flow" marker-end="url(#arrow)"/>
  <text x="269" y="82" font-size="10" text-anchor="middle" class="lbl">hash</text>
  <path d="M 440 90 L 520 90" class="flow" marker-end="url(#arrow)"/>
  <text x="480" y="82" font-size="10" text-anchor="middle" class="lbl">codifica</text>
</svg>
