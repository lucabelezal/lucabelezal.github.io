<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 365" role="img" aria-label="Diagrama: Venn C, A, P com C∩A∩P impossível sob partição">
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .c{fill:none;stroke:#0969da;stroke-width:2.5}
    .a{fill:none;stroke:#b35900;stroke-width:2.5}
    .p{fill:none;stroke:#238636;stroke-width:2.5}
    .lbl{fill:#57606a}
    .goodtext{fill:#238636;font-weight:bold}
    .badtext{fill:#c92a2a;font-weight:bold}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .c{stroke:#58a6ff}
      .a{stroke:#d29922}
      .p{stroke:#3fb950}
      .lbl{fill:#8b949e}
      .goodtext{fill:#3fb950}
      .badtext{fill:#ff6b6b}
    }
  </style>
  <circle cx="330" cy="130" r="95" class="c"/>
  <circle cx="240" cy="235" r="95" class="a"/>
  <circle cx="420" cy="235" r="95" class="p"/>
  <text x="322" y="72" font-size="18" font-weight="bold">C</text>
  <text x="286" y="92" font-size="11" class="lbl">consistência</text>
  <text x="182" y="252" font-size="18" font-weight="bold">A</text>
  <text x="138" y="270" font-size="11" class="lbl">disponibilidade</text>
  <text x="472" y="252" font-size="18" font-weight="bold">P</text>
  <text x="444" y="270" font-size="11" class="lbl">tolerância</text>
  <text x="246" y="158" font-size="11" class="lbl">C∩A</text>
  <text x="392" y="158" font-size="11" class="lbl">C∩P</text>
  <text x="308" y="292" font-size="11" class="lbl">A∩P</text>
  <text x="318" y="196" font-size="24" class="badtext">✗</text>
  <text x="296" y="216" font-size="11" class="badtext">C∩A∩P</text>
  <text x="120" y="350" font-size="14" class="goodtext">C∩P ✓ ou A∩P ✓ · C∩A∩P ✗ sob partição</text>
</svg>
