<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 660 420" role="img" aria-label="Diagrama: Venn C, A, P com C∩A∩P impossível sob partição">
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f;text-anchor:middle}
    .c{fill:none;stroke:#0969da;stroke-width:2.5}
    .a{fill:none;stroke:#b35900;stroke-width:2.5}
    .p{fill:none;stroke:#238636;stroke-width:2.5}
    .lbl{fill:#57606a}
    .goodtext{fill:#238636;font-weight:bold}
    .badtext{fill:#c92a2a;font-weight:bold}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .c{stroke:#58a6ff}
      .a{stroke:#d29922}
      .p{stroke:#3fb950}
      .lbl{fill:#8b949e}
      .goodtext{fill:#3fb950}
      .badtext{fill:#ff6b6b}
    }
  </style>
  <circle cx="330" cy="120" r="125" class="c"/>
  <circle cx="250" cy="240" r="125" class="a"/>
  <circle cx="410" cy="240" r="125" class="p"/>
  <text x="330" y="72" font-size="20" font-weight="bold">C</text>
  <text x="330" y="94" font-size="12" class="lbl">consistência</text>
  <text x="190" y="268" font-size="20" font-weight="bold">A</text>
  <text x="190" y="290" font-size="12" class="lbl">disponibilidade</text>
  <text x="470" y="268" font-size="20" font-weight="bold">P</text>
  <text x="470" y="290" font-size="12" class="lbl">tolerância ★</text>
  <text x="265" y="175" font-size="11" class="lbl">C∩A</text>
  <text x="395" y="175" font-size="11" class="lbl">C∩P</text>
  <text x="330" y="293" font-size="11" class="lbl">A∩P</text>
  <text x="330" y="205" font-size="26" class="badtext">✗</text>
  <text x="330" y="227" font-size="12" class="badtext">C∩A∩P</text>
  <text x="330" y="392" font-size="14" class="goodtext">C∩P ✓ ou A∩P ✓ · C∩A∩P ✗ sob partição</text>
</svg>
