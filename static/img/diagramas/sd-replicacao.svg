<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-label="Diagrama: replicação master/slave — escritas no master, leituras nos slaves">
  <title>Replicação de banco</title>
  <desc>O master recebe escritas e replica para os slaves; as leituras são distribuídas entre os slaves.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .store{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .ring{fill:none;stroke:#d0d7de;stroke-width:2}
    .keydot{fill:#57606a}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .store{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .ring{stroke:#30363d}
      .keydot{fill:#8b949e}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="18" y="22" font-size="11" text-anchor="start" class="lbl">Master recebe escrita; slaves servem leitura</text>
  <rect x="40" y="40" width="300" height="50" rx="8" class="proc"/>
  <text x="190" y="69" font-size="12" text-anchor="middle">Servidores web</text>
  <rect x="40" y="140" width="220" height="64" rx="8" class="store"/>
  <text x="150" y="170" font-size="12" text-anchor="middle">Master DB</text>
  <text x="150" y="187" font-size="10" text-anchor="middle" class="mono">escrita</text>
  <rect x="430" y="110" width="220" height="50" rx="8" class="store"/>
  <text x="540" y="133" font-size="12" text-anchor="middle">Slave 1</text>
  <text x="540" y="150" font-size="10" text-anchor="middle" class="mono">leitura</text>
  <rect x="430" y="190" width="220" height="50" rx="8" class="store"/>
  <text x="540" y="213" font-size="12" text-anchor="middle">Slave 2</text>
  <text x="540" y="230" font-size="10" text-anchor="middle" class="mono">leitura</text>
  <path d="M 150 90 L 150 140" class="flow" marker-end="url(#arrow)"/>
  <text x="158" y="118" font-size="10" text-anchor="start" class="lbl">write</text>
  <path d="M 260 165 L 430 135" class="flow" marker-end="url(#arrow)"/>
  <path d="M 260 180 L 430 205" class="flow" marker-end="url(#arrow)"/>
  <text x="345" y="150" font-size="10" text-anchor="middle" class="lbl">replicação</text>
  <path d="M 340 55 L 430 125" class="flow" marker-end="url(#arrow)"/>
  <path d="M 340 68 L 430 200" class="flow" marker-end="url(#arrow)"/>
  <text x="385" y="45" font-size="10" text-anchor="middle" class="lbl">read</text>
</svg>
