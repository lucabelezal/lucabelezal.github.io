<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" role="img" aria-label="Diagrama: escape da stack para o heap">
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .inner{fill:none;stroke:#57606a;stroke-width:1.5}
    .lbl{fill:#57606a}
    .dash{stroke:#0969da;stroke-width:2;fill:none;stroke-dasharray:7 5}
    .head{fill:#0969da;stroke:none}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .inner{stroke:#8b949e}
      .lbl{fill:#8b949e}
      .dash{stroke:#58a6ff}
      .head{fill:#58a6ff}
    }
  </style>
  <defs>
    <marker id="ah3" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" class="head"/>
    </marker>
  </defs>
  <rect x="20" y="30" width="190" height="240" rx="10" class="box"/>
  <text x="38" y="62" font-size="16" font-weight="bold">stack · frame</text>
  <text x="38" y="84" font-size="13" class="lbl">ficaNaStack</text>
  <rect x="45" y="100" width="140" height="60" rx="8" class="inner"/>
  <text x="60" y="136" font-size="15">x = 42</text>
  <text x="38" y="200" font-size="13" class="lbl">liberado c/</text>
  <text x="38" y="220" font-size="13" class="lbl">o return</text>
  <rect x="230" y="30" width="180" height="240" rx="10" class="box"/>
  <text x="248" y="62" font-size="16" font-weight="bold">stack · frame</text>
  <text x="248" y="84" font-size="13" class="lbl">escapaParaHeap</text>
  <rect x="255" y="100" width="130" height="60" rx="8" class="inner"/>
  <text x="270" y="136" font-size="15">x = 42</text>
  <text x="248" y="200" font-size="13" class="lbl">return &amp;x</text>
  <line x1="410" y1="130" x2="468" y2="130" class="dash" marker-end="url(#ah3)"/>
  <text x="439" y="112" font-size="13" text-anchor="middle">escapa</text>
  <rect x="474" y="70" width="166" height="120" rx="10" class="box"/>
  <text x="492" y="106" font-size="16" font-weight="bold">heap</text>
  <text x="492" y="132" font-size="13" class="lbl">sobrevive</text>
  <text x="492" y="152" font-size="13" class="lbl">ao frame</text>
</svg>
