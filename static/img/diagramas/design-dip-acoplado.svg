<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" role="img" aria-label="Diagrama: o serviço de alto nível instancia e chama diretamente o SDK externo, ficando acoplado ao detalhe">
  <title>Acoplado ao detalhe</title>
  <desc>O OrderProcessorService cria o SDK da Stripe com new e chama ChargeCreditCard direto. Alto nível depende de baixo nível.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .port{fill:none;stroke:#238636;stroke-width:2;stroke-dasharray:6 4}
    .detail{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .bad{fill:none;stroke:#cf222e;stroke-width:2}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .port{stroke:#3fb950}
      .detail{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .bad{stroke:#f85149}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="18" y="24" font-size="11" text-anchor="start" class="lbl" font-weight="bold">Alto nível preso ao detalhe — e o detalhe é de terceiros</text>
  <rect x="30" y="80" width="300" height="70" rx="8" class="proc"/>
  <text x="180" y="113" font-size="12" text-anchor="middle">OrderProcessorService</text>
  <text x="180" y="130" font-size="10" text-anchor="middle" class="mono">regra de negócio (alto nível)</text>
  <rect x="480" y="80" width="270" height="70" rx="8" class="detail"/>
  <text x="615" y="113" font-size="12" text-anchor="middle">ExternalStripeSDK</text>
  <text x="615" y="130" font-size="10" text-anchor="middle" class="mono">lib externa (baixo nível)</text>
  <path d="M 330 105 L 480 105" class="bad" marker-end="url(#arrow)"/>
  <path d="M 480 135 L 330 135" class="bad" marker-end="url(#arrow)"/>
  <text x="405" y="96" font-size="10" text-anchor="middle" class="lbl">new + ChargeCreditCard()</text>
  <text x="30" y="200" font-size="10" text-anchor="start" class="lbl">Trocar de gateway = editar a regra. Testar = bater na rede.</text>
</svg>
