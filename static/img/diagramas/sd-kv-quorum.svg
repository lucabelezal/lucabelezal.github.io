<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" role="img" aria-label="Diagrama: quorum — o coordenador espera W acknowledgements na escrita e R na leitura">
  <title>Quorum consensus</title>
  <desc>O coordenador é o proxy entre cliente e nós; a escrita espera W acks e a leitura espera R respostas.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .store{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .ring{fill:none;stroke:#d0d7de;stroke-width:2}
    .keydot{fill:#57606a}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .store{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .ring{stroke:#30363d}
      .keydot{fill:#8b949e}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="18" y="22" font-size="11" text-anchor="start" class="lbl">Quorum: W + R &gt; N garante consistência forte</text>
  <rect x="20" y="115" width="130" height="50" rx="8" class="box"/>
  <text x="85" y="144" font-size="12" text-anchor="middle">Cliente</text>
  <rect x="220" y="115" width="150" height="50" rx="8" class="proc"/>
  <text x="295" y="144" font-size="12" text-anchor="middle">Coordenador</text>
  <rect x="470" y="60" width="200" height="44" rx="8" class="store"/>
  <text x="570" y="86" font-size="12" text-anchor="middle">s0</text>
  <rect x="470" y="120" width="200" height="44" rx="8" class="store"/>
  <text x="570" y="146" font-size="12" text-anchor="middle">s1</text>
  <rect x="470" y="180" width="200" height="44" rx="8" class="store"/>
  <text x="570" y="206" font-size="12" text-anchor="middle">s2</text>
  <path d="M 150 140 L 220 140" class="flow" marker-end="url(#arrow)"/>
  <path d="M 370 130 L 470 82" class="flow" marker-end="url(#arrow)"/>
  <path d="M 370 140 L 470 142" class="flow" marker-end="url(#arrow)"/>
  <path d="M 370 150 L 470 202" class="flow" marker-end="url(#arrow)"/>
  <text x="410" y="250" font-size="10" text-anchor="middle" class="lbl">ACK</text>
  <text x="560" y="40" font-size="11" text-anchor="middle" class="lbl">N = 3</text>
</svg>
