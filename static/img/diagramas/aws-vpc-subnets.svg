<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 370" role="img" aria-label="Diagrama: VPC com sub-rede pública e privada, internet gateway, NAT gateway e security groups">
  <title>VPC com sub-redes pública e privada</title>
  <desc>O internet gateway liga a VPC à internet; a sub-rede pública contém o balanceador e o NAT; a sub-rede privada contém aplicação e banco, que saem pelo NAT.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .store{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .dash{fill:none;stroke:#57606a;stroke-width:1.4;stroke-dasharray:5 4}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    .title{fill:#24292f;font-weight:700}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .store{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .dash{stroke:#8b949e}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
      .title{fill:#e6edf3}
    }
  </style>
  <text x="18" y="24" font-size="13.75" text-anchor="start" class="lbl" font-weight="700">VPC: o que é público depende da rota, não do nome</text>
  <rect x="40" y="44" width="190" height="52" rx="8" class="proc"/>
  <text x="135" y="68" font-size="15" text-anchor="middle">Internet Gateway</text>
  <text x="135" y="85" font-size="12.5" text-anchor="middle" class="mono">porta para a internet</text>
  <rect x="18" y="112" width="640" height="224" rx="8" class="box"/>
  <text x="470" y="136" font-size="16.25" text-anchor="start" class="lbl" font-weight="700">VPC 10.0.0.0/16</text>
  <rect x="40" y="152" width="280" height="168" rx="8" class="box"/>
  <text x="56" y="174" font-size="15" text-anchor="start" class="lbl" font-weight="700">Sub-rede pública</text>
  <rect x="56" y="186" width="184" height="44" rx="8" class="box"/>
  <text x="148" y="206" font-size="15" text-anchor="middle">Load balancer</text>
  <text x="148" y="223" font-size="12.5" text-anchor="middle" class="mono">recebe 443</text>
  <rect x="56" y="244" width="184" height="44" rx="8" class="proc"/>
  <text x="148" y="264" font-size="15" text-anchor="middle">NAT Gateway</text>
  <text x="148" y="281" font-size="12.5" text-anchor="middle" class="mono">saída da privada</text>
  <rect x="360" y="152" width="278" height="168" rx="8" class="box"/>
  <text x="376" y="174" font-size="15" text-anchor="start" class="lbl" font-weight="700">Sub-rede privada</text>
  <rect x="360" y="186" width="262" height="44" rx="8" class="box"/>
  <text x="491" y="206" font-size="15" text-anchor="middle">Aplicação</text>
  <text x="491" y="223" font-size="12.5" text-anchor="middle" class="mono">sem IP público</text>
  <rect x="360" y="244" width="262" height="44" rx="8" class="store"/>
  <text x="491" y="264" font-size="15" text-anchor="middle">Banco de dados</text>
  <text x="491" y="281" font-size="12.5" text-anchor="middle" class="mono">só aceita o SG da app</text>
  <path d="M 115 96 L 115 186" class="flow" marker-end="url(#arrow)"/>
  <path d="M 240 208 L 360 208" class="flow" marker-end="url(#arrow)"/>
  <path d="M 491 230 L 491 244" class="flow" marker-end="url(#arrow)"/>
  <path d="M 360 222 L 300 222 L 300 266 L 240 266" class="flow" marker-end="url(#arrow)"/>
  <path d="M 56 266 L 28 266 L 28 70 L 40 70" class="flow" marker-end="url(#arrow)"/>
  <text x="664" y="140" font-size="13.75" text-anchor="start" class="lbl" font-weight="700">Security group:</text>
  <text x="664" y="158" font-size="12.5" text-anchor="start" class="lbl">porta 443 apenas</text>
  <text x="664" y="174" font-size="12.5" text-anchor="start" class="lbl">do SG do ALB</text>
  <text x="664" y="202" font-size="12.5" text-anchor="start" class="lbl">NACL: stateless,</text>
  <text x="664" y="218" font-size="12.5" text-anchor="start" class="lbl">avaliada por número</text>
  <text x="18" y="358" font-size="12.5" text-anchor="start" class="lbl">Instância privada sem NAT não baixa pacote: falta rota 0.0.0.0/0 para o NAT.</text>
</svg>
