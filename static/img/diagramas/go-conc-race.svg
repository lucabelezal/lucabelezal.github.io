<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 340" role="img" aria-label="Diagrama: race sem mutex, ordem com mutex">
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .goodbox{fill:none;stroke:#238636;stroke-width:2}
    .badtext{fill:#b35900;font-weight:bold}
    .goodtext{fill:#238636;font-weight:bold}
    .lbl{fill:#57606a}
    .arrow{stroke:#0969da;stroke-width:2;fill:none}
    .head{fill:#0969da;stroke:none}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .goodbox{stroke:#3fb950}
      .badtext{fill:#d29922}
      .goodtext{fill:#3fb950}
      .lbl{fill:#8b949e}
      .arrow{stroke:#58a6ff}
      .head{fill:#58a6ff}
    }
  </style>
  <defs>
    <marker id="ah15" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" class="head"/>
    </marker>
  </defs>
  <text x="20" y="60" font-size="14" class="lbl">sem mutex</text>
  <rect x="150" y="20" width="140" height="65" rx="10" class="box"/>
  <text x="166" y="48" font-size="14" font-weight="bold">g1</text>
  <text x="166" y="70" font-size="13">total++</text>
  <rect x="150" y="95" width="140" height="65" rx="10" class="box"/>
  <text x="166" y="123" font-size="14" font-weight="bold">g2</text>
  <text x="166" y="145" font-size="13">total++</text>
  <line x1="295" y1="52" x2="380" y2="75" class="arrow" marker-end="url(#ah15)"/>
  <line x1="295" y1="127" x2="380" y2="105" class="arrow" marker-end="url(#ah15)"/>
  <rect x="385" y="55" width="150" height="70" rx="10" class="box"/>
  <text x="401" y="85" font-size="14" font-weight="bold">total</text>
  <text x="401" y="109" font-size="13">lê · soma</text>
  <text x="545" y="95" font-size="14" class="badtext">race: 97–100</text>
  <text x="20" y="225" font-size="14" class="lbl">com mutex</text>
  <rect x="150" y="190" width="140" height="65" rx="10" class="box"/>
  <text x="166" y="218" font-size="14" font-weight="bold">g1 → g2</text>
  <text x="166" y="240" font-size="13">Lock · ++ · Unlock</text>
  <line x1="295" y1="222" x2="380" y2="222" class="arrow" marker-end="url(#ah15)"/>
  <rect x="385" y="190" width="150" height="65" rx="10" class="goodbox"/>
  <text x="401" y="220" font-size="14" font-weight="bold">total</text>
  <text x="401" y="244" font-size="13">um por vez</text>
  <text x="545" y="228" font-size="14" class="goodtext">= 100 sempre</text>
</svg>
