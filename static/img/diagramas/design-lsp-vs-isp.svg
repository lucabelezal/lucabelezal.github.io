<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-label="Diagrama: LSP e ISP operam em eixos diferentes — tamanho do contrato no eixo horizontal e comportamento cumprido no eixo vertical — formando quatro quadrantes">
  <title>LSP e ISP são eixos diferentes</title>
  <desc>ISP trata do tamanho do contrato; LSP trata de o comportamento ser cumprido. Um contrato pequeno ainda pode mentir (LSP violado), e um contrato gordo pode ser honesto (só ISP violado).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .port{fill:none;stroke:#238636;stroke-width:2;stroke-dasharray:6 4}
    .detail{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .bad{fill:none;stroke:#cf222e;stroke-width:2}
    .badlbl{fill:#cf222e}
    .oklbl{fill:#238636}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .port{stroke:#3fb950}
      .detail{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .bad{stroke:#f85149}
      .badlbl{fill:#f85149}
      .oklbl{fill:#3fb950}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="20" y="26" font-size="12" text-anchor="start" class="lbl" font-weight="bold">ISP cuida do tamanho do contrato; LSP, da honestidade da implementação</text>
  <path d="M 150 300 L 790 300" class="flow" marker-end="url(#arrow)"/>
  <path d="M 150 300 L 150 66" class="flow" marker-end="url(#arrow)"/>
  <text x="780" y="320" font-size="11" text-anchor="end" class="lbl">contrato maior →</text>
  <text x="160" y="62" font-size="11" text-anchor="start" class="lbl">comportamento cumprido ↑</text>
  <text x="300" y="150" font-size="12" text-anchor="middle" class="oklbl">ISP ok · LSP ok</text>
  <text x="300" y="172" font-size="11" text-anchor="middle" class="lbl">o ponto ideal</text>
  <text x="640" y="150" font-size="12" text-anchor="middle" class="lbl">ISP violado · LSP ok</text>
  <text x="640" y="172" font-size="11" text-anchor="middle" class="lbl">contrato gordo, mas honesto</text>
  <text x="300" y="240" font-size="12" text-anchor="middle" class="badlbl">ISP ok · LSP violado</text>
  <text x="300" y="262" font-size="11" text-anchor="middle" class="lbl">Generate() string que devolve URL</text>
  <text x="640" y="240" font-size="12" text-anchor="middle" class="badlbl">os dois violados</text>
  <text x="640" y="262" font-size="11" text-anchor="middle" class="lbl">contrato gordo que também mente</text>
</svg>
