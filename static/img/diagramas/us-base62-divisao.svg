<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 390" role="img" aria-label="Diagrama: conversão para base 62 com resto (% 62) e divisão inteira (/ 62) — os restos, lidos de baixo para cima, formam a URL curta">
  <title>Conversão para base 62</title>
  <desc>Em cada passo, n % 62 dá o símbolo e n / 62 (divisão inteira) dá o próximo n. Os restos, lidos de baixo para cima, formam o código.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .store{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .store{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="18" y="22" font-size="11" text-anchor="start" class="lbl">Cada passo: resto vira símbolo, quociente inteiro vira o próximo n</text>
  <rect x="20" y="60" width="560" height="64" rx="8" class="box"/>
  <text x="300" y="90" font-size="12" text-anchor="middle">11157 % 62 = 59 → X</text>
  <text x="300" y="107" font-size="10" text-anchor="middle" class="mono">11157 / 62 = 179  (divisão inteira)</text>
  <rect x="20" y="170" width="560" height="64" rx="8" class="box"/>
  <text x="300" y="200" font-size="12" text-anchor="middle">179 % 62 = 55 → T</text>
  <text x="300" y="217" font-size="10" text-anchor="middle" class="mono">179 / 62 = 2</text>
  <rect x="20" y="280" width="560" height="64" rx="8" class="box"/>
  <text x="300" y="310" font-size="12" text-anchor="middle">2 % 62 = 2 → 2</text>
  <text x="300" y="327" font-size="10" text-anchor="middle" class="mono">2 / 62 = 0  →  para</text>
  <path d="M 300 124 L 300 170" class="flow" marker-end="url(#arrow)"/>
  <path d="M 300 234 L 300 280" class="flow" marker-end="url(#arrow)"/>
  <rect x="630" y="150" width="190" height="110" rx="8" class="store"/>
  <text x="725" y="203" font-size="12" text-anchor="middle">2 T X</text>
  <text x="725" y="220" font-size="10" text-anchor="middle" class="mono">restos, de baixo para cima</text>
  <path d="M 580 312 L 630 240" class="flow" marker-end="url(#arrow)"/>
  <text x="18" y="372" font-size="10" text-anchor="start" class="lbl">Em Go: / entre inteiros descarta o resto; % dá o resto.</text>
</svg>
