<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" role="img" aria-label="Diagrama: load balancer recebe o IP público e distribui para servidores com IP privado">
  <title>Load balancer</title>
  <desc>Os usuários acessam o IP público do load balancer, que distribui o tráfego entre servidores com IP privado.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .store{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .ring{fill:none;stroke:#d0d7de;stroke-width:2}
    .keydot{fill:#57606a}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .store{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .ring{stroke:#30363d}
      .keydot{fill:#8b949e}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="18" y="22" font-size="11" text-anchor="start" class="lbl">Balanceador: IP público na frente, servidores com IP privado</text>
  <rect x="18" y="90" width="150" height="60" rx="8" class="box"/>
  <text x="93" y="124" font-size="12" text-anchor="middle">Usuário</text>
  <rect x="240" y="95" width="140" height="50" rx="8" class="proc"/>
  <text x="310" y="118" font-size="12" text-anchor="middle">Balanceador</text>
  <text x="310" y="135" font-size="10" text-anchor="middle" class="mono">IP público</text>
  <rect x="460" y="60" width="240" height="50" rx="8" class="box"/>
  <text x="580" y="83" font-size="12" text-anchor="middle">Servidor 1</text>
  <text x="580" y="100" font-size="10" text-anchor="middle" class="mono">10.0.0.1</text>
  <rect x="460" y="140" width="240" height="50" rx="8" class="box"/>
  <text x="580" y="163" font-size="12" text-anchor="middle">Servidor 2</text>
  <text x="580" y="180" font-size="10" text-anchor="middle" class="mono">10.0.0.2</text>
  <path d="M 168 120 L 240 120" class="flow" marker-end="url(#arrow)"/>
  <path d="M 380 112 L 460 85" class="flow" marker-end="url(#arrow)"/>
  <path d="M 380 128 L 460 165" class="flow" marker-end="url(#arrow)"/>
</svg>
