<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" role="img" aria-label="Diagrama: usuário resolve o domínio no Route 53, busca o conteúdo no edge do CloudFront e chega à origem pela load balancer">
  <title>Entrega de conteúdo</title>
  <desc>O usuário resolve o domínio no Route 53, chega ao ponto de presença do CloudFront; em cache hit o edge responde, em cache miss a origem é consultada.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .store{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .dash{fill:none;stroke:#57606a;stroke-width:1.4;stroke-dasharray:5 4}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    .title{fill:#24292f;font-weight:700}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .store{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .dash{stroke:#8b949e}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
      .title{fill:#e6edf3}
    }
  </style>
  <text x="18" y="24" font-size="13.75" text-anchor="start" class="lbl" font-weight="700">Três camadas: DNS encontra, CDN entrega perto, load balancer distribui</text>
  <rect x="18" y="80" width="150" height="60" rx="8" class="box"/>
  <text x="93" y="108" font-size="15" text-anchor="middle">Usuário</text>
  <text x="93" y="125" font-size="12.5" text-anchor="middle" class="mono">Tóquio</text>
  <rect x="206" y="80" width="150" height="60" rx="8" class="proc"/>
  <text x="281" y="108" font-size="15" text-anchor="middle">Route 53</text>
  <text x="281" y="125" font-size="12.5" text-anchor="middle" class="mono">DNS</text>
  <rect x="394" y="80" width="160" height="60" rx="8" class="proc"/>
  <text x="474" y="108" font-size="15" text-anchor="middle">CloudFront edge</text>
  <text x="474" y="125" font-size="12.5" text-anchor="middle" class="mono">cache</text>
  <rect x="600" y="80" width="120" height="60" rx="8" class="store"/>
  <text x="660" y="108" font-size="15" text-anchor="middle">Origem</text>
  <text x="660" y="125" font-size="12.5" text-anchor="middle" class="mono">S3 / ALB</text>
  <rect x="728" y="80" width="114" height="60" rx="8" class="box"/>
  <text x="785" y="108" font-size="15" text-anchor="middle">App</text>
  <text x="785" y="125" font-size="12.5" text-anchor="middle" class="mono">privada</text>
  <path d="M 168 100 L 206 100" class="flow" marker-end="url(#arrow)"/>
  <text x="187" y="70" font-size="11.25" text-anchor="middle" class="lbl">nome → IP</text>
  <path d="M 356 100 L 394 100" class="flow" marker-end="url(#arrow)"/>
  <path d="M 554 100 L 600 100" class="flow" marker-end="url(#arrow)"/>
  <text x="577" y="70" font-size="11.25" text-anchor="middle" class="lbl">miss</text>
  <path d="M 720 100 L 728 100" class="flow" marker-end="url(#arrow)"/>
  <path d="M 394 130 L 394 190 L 93 190 L 93 140" class="flow" marker-end="url(#arrow)"/>
  <text x="243" y="208" font-size="12.5" text-anchor="middle" class="lbl">hit: o edge responde sem ir à origem</text>
  <text x="18" y="246" font-size="12.5" text-anchor="start" class="lbl">TTL alto melhora o hit ratio e atrasa a atualização. Versionar o arquivo evita invalidação.</text>
</svg>
