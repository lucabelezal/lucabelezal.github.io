<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" role="img" aria-label="Diagrama: arquitetura com estado (sticky) versus sem estado com store compartilhado">
  <title>Com estado vs sem estado</title>
  <desc>Com estado, cada usuário fica preso a um servidor. Sem estado, os servidores buscam o estado num store compartilhado.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .store{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .ring{fill:none;stroke:#d0d7de;stroke-width:2}
    .keydot{fill:#57606a}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .store{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .ring{stroke:#30363d}
      .keydot{fill:#8b949e}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="30" y="24" font-size="11" text-anchor="start" class="lbl" font-weight="bold">Com estado (sticky)</text>
  <rect x="30" y="60" width="130" height="46" rx="8" class="box"/>
  <text x="95" y="87" font-size="12" text-anchor="middle">Usuário A</text>
  <rect x="210" y="60" width="200" height="46" rx="8" class="proc"/>
  <text x="310" y="81" font-size="12" text-anchor="middle">Servidor 1</text>
  <text x="310" y="98" font-size="10" text-anchor="middle" class="mono">sessão de A</text>
  <path d="M 160 83 L 210 83" class="flow" marker-end="url(#arrow)"/>
  <rect x="30" y="140" width="130" height="46" rx="8" class="box"/>
  <text x="95" y="167" font-size="12" text-anchor="middle">Usuário B</text>
  <rect x="210" y="140" width="200" height="46" rx="8" class="proc"/>
  <text x="310" y="161" font-size="12" text-anchor="middle">Servidor 2</text>
  <text x="310" y="178" font-size="10" text-anchor="middle" class="mono">sessão de B</text>
  <path d="M 160 163 L 210 163" class="flow" marker-end="url(#arrow)"/>
  <text x="30" y="225" font-size="10" text-anchor="start" class="lbl">cada usuário preso ao seu servidor</text>
  <text x="470" y="24" font-size="11" text-anchor="start" class="lbl" font-weight="bold">Sem estado</text>
  <rect x="470" y="60" width="130" height="46" rx="8" class="box"/>
  <text x="535" y="87" font-size="12" text-anchor="middle">Usuário A</text>
  <rect x="650" y="50" width="200" height="36" rx="8" class="proc"/>
  <text x="750" y="72" font-size="12" text-anchor="middle">Servidor 1</text>
  <rect x="650" y="92" width="200" height="36" rx="8" class="proc"/>
  <text x="750" y="114" font-size="12" text-anchor="middle">Servidor 2</text>
  <rect x="650" y="134" width="200" height="36" rx="8" class="proc"/>
  <text x="750" y="156" font-size="12" text-anchor="middle">Servidor 3</text>
  <path d="M 600 83 L 650 68" class="flow" marker-end="url(#arrow)"/>
  <path d="M 600 83 L 650 110" class="flow" marker-end="url(#arrow)"/>
  <path d="M 600 83 L 650 152" class="flow" marker-end="url(#arrow)"/>
  <rect x="650" y="210" width="200" height="46" rx="8" class="store"/>
  <text x="750" y="237" font-size="12" text-anchor="middle">Store compartilhado</text>
  <path d="M 750 170 L 750 210" class="flow" marker-end="url(#arrow)"/>
  <text x="470" y="235" font-size="10" text-anchor="start" class="lbl">estado fora do servidor → escala fácil</text>
</svg>
