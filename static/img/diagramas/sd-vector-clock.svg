<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 320" role="img" aria-label="Diagrama: vector clocks resolvem conflito de versões — D3 e D4 são irmãos, D5 reconcilia">
  <title>Versionamento com vector clock</title>
  <desc>Duas escritas concorrentes geram versões irmãs; o cliente detecta o conflito e reconcilia numa nova versão.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .store{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .ring{fill:none;stroke:#d0d7de;stroke-width:2}
    .keydot{fill:#57606a}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .store{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .ring{stroke:#30363d}
      .keydot{fill:#8b949e}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="18" y="22" font-size="11" text-anchor="start" class="lbl">Vector clock: detecta conflito entre versões</text>
  <rect x="30" y="140" width="150" height="46" rx="8" class="box"/>
  <text x="105" y="161" font-size="12" text-anchor="middle">D1</text>
  <text x="105" y="178" font-size="10" text-anchor="middle" class="mono">Sx,1</text>
  <rect x="230" y="140" width="150" height="46" rx="8" class="box"/>
  <text x="305" y="161" font-size="12" text-anchor="middle">D2</text>
  <text x="305" y="178" font-size="10" text-anchor="middle" class="mono">Sx,2</text>
  <rect x="450" y="60" width="190" height="46" rx="8" class="box"/>
  <text x="545" y="81" font-size="12" text-anchor="middle">D3</text>
  <text x="545" y="98" font-size="10" text-anchor="middle" class="mono">Sx,2 · Sy,1</text>
  <rect x="450" y="220" width="190" height="46" rx="8" class="box"/>
  <text x="545" y="241" font-size="12" text-anchor="middle">D4</text>
  <text x="545" y="258" font-size="10" text-anchor="middle" class="mono">Sx,2 · Sz,1</text>
  <rect x="660" y="140" width="110" height="46" rx="8" class="box"/>
  <text x="715" y="161" font-size="12" text-anchor="middle">D5</text>
  <text x="715" y="178" font-size="10" text-anchor="middle" class="mono">reconciliado</text>
  <path d="M 180 163 L 230 163" class="flow" marker-end="url(#arrow)"/>
  <path d="M 380 155 L 450 90" class="flow" marker-end="url(#arrow)"/>
  <path d="M 380 170 L 450 235" class="flow" marker-end="url(#arrow)"/>
  <path d="M 640 90 L 660 140" class="flow" marker-end="url(#arrow)"/>
  <path d="M 640 235 L 660 180" class="flow" marker-end="url(#arrow)"/>
  <text x="430" y="300" font-size="10" text-anchor="start" class="lbl">D3 e D4: irmãos (conflito)</text>
</svg>
