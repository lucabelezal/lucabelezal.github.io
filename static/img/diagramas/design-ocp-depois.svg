<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" role="img" aria-label="Diagrama: Order delega para a interface Discount; FixedDiscount, PercentageDiscount, NoDiscount e o novo CouponDiscount implementam o contrato sem editar Order">
  <title>OCP com Strategy</title>
  <desc>Order guarda uma estratégia Discount e delega. Novas estratégias implementam o mesmo contrato ou decoram outra estratégia, sem alterar Order.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .port{fill:none;stroke:#238636;stroke-width:2;stroke-dasharray:6 4}
    .detail{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .bad{fill:none;stroke:#cf222e;stroke-width:2}
    .badlbl{fill:#cf222e}
    .oklbl{fill:#238636}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .port{stroke:#3fb950}
      .detail{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .bad{stroke:#f85149}
      .badlbl{fill:#f85149}
      .oklbl{fill:#3fb950}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="20" y="26" font-size="12" text-anchor="start" class="lbl" font-weight="bold">Order delega; novas estratégias entram sem editar a classe</text>
  <rect x="30" y="140" width="220" height="80" rx="8" class="proc"/>
  <text x="140" y="178" font-size="13" text-anchor="middle">Order</text>
  <text x="140" y="195" font-size="11" text-anchor="middle" class="mono">FinalAmount()</text>
  <rect x="330" y="150" width="220" height="60" rx="8" class="port"/>
  <text x="440" y="178" font-size="13" text-anchor="middle">Discount</text>
  <text x="440" y="195" font-size="11" text-anchor="middle" class="mono">Apply(Money) Money</text>
  <rect x="620" y="40" width="250" height="54" rx="8" class="detail"/>
  <text x="745" y="65" font-size="13" text-anchor="middle">FixedDiscount</text>
  <text x="745" y="82" font-size="11" text-anchor="middle" class="mono">valor fixo</text>
  <rect x="620" y="112" width="250" height="54" rx="8" class="detail"/>
  <text x="745" y="137" font-size="13" text-anchor="middle">PercentageDiscount</text>
  <text x="745" y="154" font-size="11" text-anchor="middle" class="mono">percentual</text>
  <rect x="620" y="184" width="250" height="54" rx="8" class="detail"/>
  <text x="745" y="209" font-size="13" text-anchor="middle">NoDiscount</text>
  <text x="745" y="226" font-size="11" text-anchor="middle" class="mono">sem desconto</text>
  <rect x="620" y="256" width="250" height="54" rx="8" class="detail"/>
  <text x="745" y="281" font-size="13" text-anchor="middle">CouponDiscount</text>
  <text x="745" y="298" font-size="11" text-anchor="middle" class="mono">novo</text>
  <path d="M 250 180 L 330 180" class="flow" marker-end="url(#arrow)"/>
  <text x="290" y="172" font-size="11" text-anchor="middle" class="lbl">delega</text>
  <text x="290" y="210" font-size="10" text-anchor="middle" class="lbl">troca em runtime</text>
  <path d="M 620 67 L 550 150" class="flow" marker-end="url(#arrow)"/>
  <path d="M 620 139 L 550 168" class="flow" marker-end="url(#arrow)"/>
  <path d="M 620 211 L 550 186" class="flow" marker-end="url(#arrow)"/>
  <path d="M 620 283 L 550 204" class="flow" marker-end="url(#arrow)"/>
  <text x="585" y="130" font-size="11" text-anchor="middle" class="lbl">implementa</text>
  <text x="20" y="345" font-size="11" text-anchor="start" class="oklbl">Novo desconto = nova struct; Order não muda.</text>
</svg>
