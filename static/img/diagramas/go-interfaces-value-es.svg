<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" role="img" aria-label="Diagrama: interface con tipo no es nil">
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .lbl{fill:#57606a}
    .bad{fill:#b35900;font-weight:bold}
    .arrow{stroke:#0969da;stroke-width:2;fill:none}
    .head{fill:#0969da;stroke:none}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .lbl{fill:#8b949e}
      .bad{fill:#d29922}
      .arrow{stroke:#58a6ff}
      .head{fill:#58a6ff}
    }
  </style>
  <defs>
    <marker id="ah7" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" class="head"/>
    </marker>
  </defs>
  <rect x="20" y="70" width="180" height="100" rx="10" class="box"/>
  <text x="38" y="106" font-size="16" font-weight="bold">d</text>
  <text x="38" y="134" font-size="14">(*Dog)(nil)</text>
  <line x1="205" y1="120" x2="285" y2="120" class="arrow" marker-end="url(#ah7)"/>
  <rect x="290" y="70" width="170" height="100" rx="10" class="box"/>
  <text x="308" y="106" font-size="14">tipo: *Dog</text>
  <text x="308" y="134" font-size="14">valor: nil</text>
  <line x1="465" y1="120" x2="505" y2="120" class="arrow" marker-end="url(#ah7)"/>
  <text x="520" y="112" font-size="15" class="bad">== nil?</text>
  <text x="520" y="138" font-size="15" class="bad">false</text>
  <text x="290" y="205" font-size="13" class="lbl">tiene tipo → no es nil</text>
</svg>
