<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" role="img" aria-label="Diagrama: no anel, a chave é replicada nos N primeiros servidores no sentido horário">
  <title>Replicação no anel</title>
  <desc>Com N=3, key0 é replicada em s1, s2 e s3, os três primeiros servidores após a chave no anel.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .store{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .ring{fill:none;stroke:#d0d7de;stroke-width:2}
    .keydot{fill:#57606a}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .store{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .ring{stroke:#30363d}
      .keydot{fill:#8b949e}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="18" y="22" font-size="11" text-anchor="start" class="lbl">Replicação: N primeiros servidores após a chave</text>
  <circle cx="310" cy="200" r="130" class="ring"/>
  <circle cx="310" cy="70" r="22" class="proc"/>
  <text x="310" y="74" font-size="10" text-anchor="middle">s0</text>
  <circle cx="402" cy="108" r="22" class="store"/>
  <text x="402" y="112" font-size="10" text-anchor="middle">s1</text>
  <circle cx="440" cy="200" r="22" class="store"/>
  <text x="440" y="204" font-size="10" text-anchor="middle">s2</text>
  <circle cx="402" cy="292" r="22" class="store"/>
  <text x="402" y="296" font-size="10" text-anchor="middle">s3</text>
  <circle cx="310" cy="330" r="22" class="proc"/>
  <text x="310" y="334" font-size="10" text-anchor="middle">s4</text>
  <circle cx="218" cy="292" r="22" class="proc"/>
  <text x="218" y="296" font-size="10" text-anchor="middle">s5</text>
  <circle cx="180" cy="200" r="22" class="proc"/>
  <text x="180" y="204" font-size="10" text-anchor="middle">s6</text>
  <circle cx="218" cy="108" r="22" class="proc"/>
  <text x="218" y="112" font-size="10" text-anchor="middle">s7</text>
  <circle cx="354" cy="78" r="5" class="keydot"/>
  <text x="363" y="82" font-size="10" class="lbl">key0</text>
  <text x="470" y="60" font-size="11" text-anchor="start" class="lbl">N = 3</text>
</svg>
