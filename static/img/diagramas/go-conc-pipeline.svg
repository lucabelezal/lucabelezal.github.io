<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" role="img" aria-label="Diagrama: pipeline gen, workers square, soma">
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .goodbox{fill:none;stroke:#238636;stroke-width:2}
    .goodtext{fill:#238636;font-weight:bold}
    .lbl{fill:#57606a}
    .arrow{stroke:#0969da;stroke-width:2;fill:none}
    .head{fill:#0969da;stroke:none}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .goodbox{stroke:#3fb950}
      .goodtext{fill:#3fb950}
      .lbl{fill:#8b949e}
      .arrow{stroke:#58a6ff}
      .head{fill:#58a6ff}
    }
  </style>
  <defs>
    <marker id="ah14" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" class="head"/>
    </marker>
  </defs>
  <rect x="25" y="105" width="130" height="75" rx="10" class="box"/>
  <text x="41" y="136" font-size="16" font-weight="bold">gen</text>
  <text x="41" y="162" font-size="13" class="lbl">1,2,3,4</text>
  <line x1="160" y1="125" x2="235" y2="80" class="arrow" marker-end="url(#ah14)"/>
  <line x1="160" y1="150" x2="235" y2="200" class="arrow" marker-end="url(#ah14)"/>
  <rect x="240" y="40" width="150" height="70" rx="10" class="box"/>
  <text x="256" y="70" font-size="14" font-weight="bold">square</text>
  <text x="256" y="94" font-size="13" class="lbl">worker 1</text>
  <rect x="240" y="165" width="150" height="70" rx="10" class="box"/>
  <text x="256" y="195" font-size="14" font-weight="bold">square</text>
  <text x="256" y="219" font-size="13" class="lbl">worker 2</text>
  <line x1="395" y1="75" x2="470" y2="120" class="arrow" marker-end="url(#ah14)"/>
  <line x1="395" y1="200" x2="470" y2="155" class="arrow" marker-end="url(#ah14)"/>
  <rect x="475" y="105" width="160" height="75" rx="10" class="goodbox"/>
  <text x="491" y="136" font-size="16" font-weight="bold">soma</text>
  <text x="491" y="162" font-size="14" class="goodtext">= 30</text>
</svg>
