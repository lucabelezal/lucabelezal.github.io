<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" role="img" aria-label="Diagrama: virtual nodes distribuem cada servidor em vários pontos do anel, equilibrando a carga">
  <title>Virtual nodes</title>
  <desc>Cada servidor físico vira vários nós virtuais no anel, o que equilibra a distribuição das chaves.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .store{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .ring{fill:none;stroke:#d0d7de;stroke-width:2}
    .keydot{fill:#57606a}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .store{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .ring{stroke:#30363d}
      .keydot{fill:#8b949e}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="18" y="22" font-size="11" text-anchor="start" class="lbl">Virtual nodes: cada servidor em vários pontos</text>
  <circle cx="310" cy="200" r="130" class="ring"/>
  <circle cx="310" cy="70" r="22" class="proc"/>
  <text x="310" y="74" font-size="10" text-anchor="middle">s0_0</text>
  <circle cx="423" cy="135" r="22" class="proc"/>
  <text x="423" y="139" font-size="10" text-anchor="middle">s1_0</text>
  <circle cx="423" cy="265" r="22" class="proc"/>
  <text x="423" y="269" font-size="10" text-anchor="middle">s0_1</text>
  <circle cx="310" cy="330" r="22" class="proc"/>
  <text x="310" y="334" font-size="10" text-anchor="middle">s1_1</text>
  <circle cx="197" cy="265" r="22" class="proc"/>
  <text x="197" y="269" font-size="10" text-anchor="middle">s0_2</text>
  <circle cx="197" cy="135" r="22" class="proc"/>
  <text x="197" y="139" font-size="10" text-anchor="middle">s1_2</text>
  <circle cx="375" cy="87" r="5" class="keydot"/>
  <text x="384" y="91" font-size="10" class="lbl">k0</text>
  <path d="M 375 87 L 405 120" class="flow" marker-end="url(#arrow)"/>
  <text x="470" y="60" font-size="10" text-anchor="start" class="lbl">k0 → s1_0 → servidor 1</text>
</svg>
