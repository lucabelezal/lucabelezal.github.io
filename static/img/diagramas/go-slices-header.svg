<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" role="img" aria-label="Diagrama: header do slice apontando para o backing array">
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .cell{fill:none;stroke:#0969da;stroke-width:2}
    .extra{fill:none;stroke:#57606a;stroke-width:1.5;stroke-dasharray:5 4}
    .lbl{fill:#57606a}
    .arrow{stroke:#0969da;stroke-width:2;fill:none}
    .head{fill:#0969da;stroke:none}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .cell{stroke:#58a6ff}
      .extra{stroke:#8b949e}
      .lbl{fill:#8b949e}
      .arrow{stroke:#58a6ff}
      .head{fill:#58a6ff}
    }
  </style>
  <defs>
    <marker id="ah9" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" class="head"/>
    </marker>
  </defs>
  <rect x="25" y="55" width="200" height="140" rx="10" class="box"/>
  <text x="43" y="87" font-size="16" font-weight="bold">slice</text>
  <text x="43" y="117" font-size="14">ptr ───→</text>
  <text x="43" y="145" font-size="14">len = 3</text>
  <text x="43" y="173" font-size="14">cap = 5</text>
  <line x1="150" y1="112" x2="300" y2="112" class="arrow" marker-end="url(#ah9)"/>
  <rect x="305" y="70" width="56" height="56" class="cell"/>
  <text x="318" y="105" font-size="15">10</text>
  <rect x="361" y="70" width="56" height="56" class="cell"/>
  <text x="374" y="105" font-size="15">20</text>
  <rect x="417" y="70" width="56" height="56" class="cell"/>
  <text x="430" y="105" font-size="15">30</text>
  <rect x="473" y="70" width="56" height="56" class="extra"/>
  <text x="486" y="105" font-size="15" class="lbl">40</text>
  <rect x="529" y="70" width="56" height="56" class="extra"/>
  <text x="542" y="105" font-size="15" class="lbl">50</text>
  <text x="305" y="160" font-size="13" class="lbl">└─ len ─┘</text>
  <text x="305" y="182" font-size="13" class="lbl">└──── cap ────┘</text>
  <text x="305" y="214" font-size="13" class="lbl">backing array</text>
</svg>
