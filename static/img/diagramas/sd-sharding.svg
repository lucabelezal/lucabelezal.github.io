<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 260" role="img" aria-label="Diagrama: sharding por user_id % 4 distribui as linhas entre quatro shards">
  <title>Sharding</title>
  <desc>Uma função de hash do sharding key decide em qual shard a linha é gravada e lida.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .store{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .ring{fill:none;stroke:#d0d7de;stroke-width:2}
    .keydot{fill:#57606a}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .store{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .ring{stroke:#30363d}
      .keydot{fill:#8b949e}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="18" y="22" font-size="11" text-anchor="start" class="lbl">Sharding: o sharding key decide o shard</text>
  <rect x="20" y="100" width="140" height="56" rx="8" class="box"/>
  <text x="90" y="126" font-size="12" text-anchor="middle">Requisição</text>
  <text x="90" y="143" font-size="10" text-anchor="middle" class="mono">user_id</text>
  <polygon points="250,88 330,128 250,168 170,128" class="proc"/>
  <text x="250" y="132" font-size="12" text-anchor="middle">user_id % 4</text>
  <rect x="430" y="30" width="200" height="40" rx="8" class="store"/>
  <text x="530" y="54" font-size="12" text-anchor="middle">Shard 0</text>
  <rect x="430" y="80" width="200" height="40" rx="8" class="store"/>
  <text x="530" y="104" font-size="12" text-anchor="middle">Shard 1</text>
  <rect x="430" y="130" width="200" height="40" rx="8" class="store"/>
  <text x="530" y="154" font-size="12" text-anchor="middle">Shard 2</text>
  <rect x="430" y="180" width="200" height="40" rx="8" class="store"/>
  <text x="530" y="204" font-size="12" text-anchor="middle">Shard 3</text>
  <path d="M 160 128 L 170 128" class="flow" marker-end="url(#arrow)"/>
  <path d="M 330 112 L 430 50" class="flow" marker-end="url(#arrow)"/>
  <path d="M 330 124 L 430 100" class="flow" marker-end="url(#arrow)"/>
  <path d="M 330 136 L 430 150" class="flow" marker-end="url(#arrow)"/>
  <path d="M 330 148 L 430 200" class="flow" marker-end="url(#arrow)"/>
</svg>
