<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" role="img" aria-label="Diagrama: MVC em Go — Model é struct com tag, View é JSON na resposta, Controller é o handler; regra que cresce vira service mais repository">
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .goodbox{fill:none;stroke:#238636;stroke-width:2}
    .lbl{fill:#57606a}
    .arrow{stroke:#0969da;stroke-width:2;fill:none}
    .head{fill:#0969da;stroke:none}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .goodbox{stroke:#3fb950}
      .lbl{fill:#8b949e}
      .arrow{stroke:#58a6ff}
      .head{fill:#58a6ff}
    }
  </style>
  <defs>
    <marker id="ah34" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" class="head"/>
    </marker>
  </defs>
  <rect x="18" y="24" width="196" height="88" rx="10" class="box"/>
  <text x="32" y="50" font-size="14" font-weight="bold">Model</text>
  <text x="32" y="72" font-size="13">struct + json tag</text>
  <text x="32" y="94" font-size="13" class="lbl">só dado</text>
  <rect x="232" y="24" width="196" height="88" rx="10" class="box"/>
  <text x="246" y="50" font-size="14" font-weight="bold">View</text>
  <text x="246" y="72" font-size="13">JSON na w</text>
  <text x="246" y="94" font-size="13" class="lbl">sem template</text>
  <rect x="446" y="24" width="196" height="88" rx="10" class="box"/>
  <text x="460" y="50" font-size="14" font-weight="bold">Controller</text>
  <text x="460" y="72" font-size="13">handler.Double</text>
  <text x="460" y="94" font-size="13" class="lbl">Decode → Encode</text>
  <line x1="544" y1="112" x2="544" y2="144" class="arrow" marker-end="url(#ah34)"/>
  <text x="330" y="136" font-size="13" class="lbl">regra cresce? extraia</text>
  <rect x="120" y="144" width="420" height="92" rx="10" class="goodbox"/>
  <text x="136" y="170" font-size="14" font-weight="bold">service.Double(n)</text>
  <text x="136" y="192" font-size="13">regra pura · sem net/http</text>
  <text x="136" y="214" font-size="13" class="lbl">repository: interface → postgres/memória</text>
  <text x="120" y="264" font-size="13" class="lbl">seta de dependência: handler → service → repository (para dentro)</text>
  <text x="120" y="286" font-size="13" class="lbl">porta de entrada da hexagonal, sem framework novo</text>
</svg>
