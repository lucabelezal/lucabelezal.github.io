<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-label="Diagrama: o serviço depende da interface PaymentGateway; o adapter implementa a porta e envolve o SDK externo">
  <title>Invertido com DIP e Adapter</title>
  <desc>O OrderProcessorService depende da interface PaymentGateway. O StripeAdapter implementa essa porta e traduz as chamadas para o SDK externo.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .port{fill:none;stroke:#238636;stroke-width:2;stroke-dasharray:6 4}
    .detail{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .bad{fill:none;stroke:#cf222e;stroke-width:2}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .port{stroke:#3fb950}
      .detail{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .bad{stroke:#f85149}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="18" y="24" font-size="11" text-anchor="start" class="lbl" font-weight="bold">A seta aponta para a abstração; o adapter envolve o detalhe</text>
  <rect x="30" y="100" width="260" height="70" rx="8" class="proc"/>
  <text x="160" y="133" font-size="12" text-anchor="middle">OrderProcessorService</text>
  <text x="160" y="150" font-size="10" text-anchor="middle" class="mono">alto nível</text>
  <rect x="370" y="108" width="200" height="54" rx="8" class="port"/>
  <text x="470" y="133" font-size="12" text-anchor="middle">PaymentGateway</text>
  <text x="470" y="150" font-size="10" text-anchor="middle" class="mono">«interface» (porta)</text>
  <rect x="650" y="60" width="190" height="54" rx="8" class="box"/>
  <text x="745" y="85" font-size="12" text-anchor="middle">StripeAdapter</text>
  <text x="745" y="102" font-size="10" text-anchor="middle" class="mono">adapter</text>
  <rect x="650" y="200" width="190" height="54" rx="8" class="detail"/>
  <text x="745" y="225" font-size="12" text-anchor="middle">ExternalStripeSDK</text>
  <text x="745" y="242" font-size="10" text-anchor="middle" class="mono">lib externa</text>
  <path d="M 290 128 L 370 128" class="flow" marker-end="url(#arrow)"/>
  <text x="330" y="120" font-size="10" text-anchor="middle" class="lbl">depende</text>
  <path d="M 650 100 L 570 120" class="flow" marker-end="url(#arrow)"/>
  <text x="612" y="100" font-size="10" text-anchor="middle" class="lbl">implementa</text>
  <path d="M 745 114 L 745 200" class="flow" marker-end="url(#arrow)"/>
  <text x="755" y="162" font-size="10" text-anchor="start" class="lbl">envolve</text>
</svg>
