<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 380" role="img" aria-label="Diagrama: subida registra interesse, descida entrega o request">
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .goodbox{fill:none;stroke:#238636;stroke-width:2}
    .lbl{fill:#57606a}
    .arrow{stroke:#0969da;stroke-width:2;fill:none}
    .head{fill:#0969da;stroke:none}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .goodbox{stroke:#3fb950}
      .lbl{fill:#8b949e}
      .arrow{stroke:#58a6ff}
      .head{fill:#58a6ff}
    }
  </style>
  <defs>
    <marker id="ahseq" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" class="head"/>
    </marker>
  </defs>
  <text x="25" y="28" font-size="13" class="lbl">subida: o programa pede (uma vez)</text>
  <rect x="25" y="40" width="275" height="58" rx="10" class="box"/>
  <text x="41" y="66" font-size="14" font-weight="bold">processo Go</text>
  <text x="41" y="88" font-size="13" class="lbl">net.Listen tcp :8080</text>
  <line x1="162" y1="98" x2="162" y2="118" class="arrow" marker-end="url(#ahseq)"/>
  <rect x="25" y="120" width="275" height="58" rx="10" class="box"/>
  <text x="41" y="146" font-size="14" font-weight="bold">socket TCP :8080</text>
  <text x="41" y="168" font-size="13" class="lbl">SO registra socket → PID</text>
  <line x1="162" y1="178" x2="162" y2="198" class="arrow" marker-end="url(#ahseq)"/>
  <rect x="25" y="200" width="275" height="58" rx="10" class="box"/>
  <text x="41" y="226" font-size="14" font-weight="bold">kernel expõe</text>
  <text x="41" y="248" font-size="13" class="lbl">TCP/IP na rede</text>
  <text x="360" y="28" font-size="13" class="lbl">descida: a rede entrega (por request)</text>
  <rect x="360" y="40" width="275" height="58" rx="10" class="box"/>
  <text x="376" y="66" font-size="14" font-weight="bold">internet</text>
  <text x="376" y="88" font-size="13" class="lbl">IP + porta :8080</text>
  <line x1="497" y1="98" x2="497" y2="118" class="arrow" marker-end="url(#ahseq)"/>
  <rect x="360" y="120" width="275" height="58" rx="10" class="box"/>
  <text x="376" y="146" font-size="14" font-weight="bold">kernel → socket</text>
  <text x="376" y="168" font-size="13" class="lbl">Accept() devolve Conn</text>
  <line x1="497" y1="178" x2="497" y2="198" class="arrow" marker-end="url(#ahseq)"/>
  <rect x="360" y="200" width="275" height="58" rx="10" class="goodbox"/>
  <text x="376" y="226" font-size="14" font-weight="bold">Request → handler</text>
  <text x="376" y="248" font-size="13" class="lbl">net/http parseia bytes</text>
  <text x="25" y="292" font-size="13" class="lbl">diagnóstico: leia de baixo para cima —</text>
  <text x="25" y="314" font-size="13" class="lbl">processo vivo? porta registrada? firewall?</text>
  <text x="25" y="336" font-size="13" class="lbl">só então olhe o handler.</text>
</svg>
