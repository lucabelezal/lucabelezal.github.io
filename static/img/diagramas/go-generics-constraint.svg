<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" role="img" aria-label="Diagrama: constraint Ordered como união, Min instanciado">
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .goodbox{fill:none;stroke:#238636;stroke-width:2}
    .lbl{fill:#57606a}
    .arrow{stroke:#0969da;stroke-width:2;fill:none}
    .head{fill:#0969da;stroke:none}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .goodbox{stroke:#3fb950}
      .lbl{fill:#8b949e}
      .arrow{stroke:#58a6ff}
      .head{fill:#58a6ff}
    }
  </style>
  <defs>
    <marker id="ah19" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" class="head"/>
    </marker>
  </defs>
  <rect x="30" y="40" width="250" height="200" rx="10" class="box"/>
  <text x="50" y="72" font-size="16" font-weight="bold">Ordered</text>
  <text x="50" y="96" font-size="13" class="lbl">constraint = união</text>
  <text x="50" y="126" font-size="14">~int | ~int64</text>
  <text x="50" y="152" font-size="14">~float64</text>
  <text x="50" y="178" font-size="14">~string | ...</text>
  <text x="50" y="212" font-size="13" class="lbl">type set</text>
  <line x1="285" y1="140" x2="365" y2="140" class="arrow" marker-end="url(#ah19)"/>
  <rect x="370" y="40" width="260" height="200" rx="10" class="goodbox"/>
  <text x="390" y="72" font-size="16" font-weight="bold">Min[T Ordered]</text>
  <text x="390" y="106" font-size="14">Min(3, 7) → T = int</text>
  <text x="390" y="136" font-size="14">Min("b","a") → T = string</text>
  <text x="390" y="170" font-size="13" class="lbl">inferência por uso</text>
  <text x="390" y="212" font-size="13" class="lbl">1 função · N tipos</text>
</svg>
