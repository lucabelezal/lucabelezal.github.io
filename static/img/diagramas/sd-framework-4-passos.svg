<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 200" role="img" aria-label="Diagrama: o processo de 4 passos de uma entrevista de system design">
  <title>Processo de 4 passos</title>
  <desc>Entender o problema e o escopo, propor o alto nível, aprofundar nos componentes críticos e fechar.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .store{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .ring{fill:none;stroke:#d0d7de;stroke-width:2}
    .keydot{fill:#57606a}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .store{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .ring{stroke:#30363d}
      .keydot{fill:#8b949e}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="18" y="22" font-size="11" text-anchor="start" class="lbl">O processo de 4 passos</text>
  <rect x="20" y="70" width="180" height="64" rx="8" class="proc"/>
  <text x="110" y="100" font-size="12" text-anchor="middle">1. Entender</text>
  <text x="110" y="117" font-size="10" text-anchor="middle" class="mono">problema + escopo</text>
  <rect x="220" y="70" width="180" height="64" rx="8" class="proc"/>
  <text x="310" y="100" font-size="12" text-anchor="middle">2. Alto nível</text>
  <text x="310" y="117" font-size="10" text-anchor="middle" class="mono">blueprint + buy-in</text>
  <rect x="420" y="70" width="180" height="64" rx="8" class="proc"/>
  <text x="510" y="100" font-size="12" text-anchor="middle">3. Deep dive</text>
  <text x="510" y="117" font-size="10" text-anchor="middle" class="mono">componentes críticos</text>
  <rect x="620" y="70" width="180" height="64" rx="8" class="proc"/>
  <text x="710" y="100" font-size="12" text-anchor="middle">4. Fechar</text>
  <text x="710" y="117" font-size="10" text-anchor="middle" class="mono">gargalos + next</text>
  <path d="M 200 102 L 220 102" class="flow" marker-end="url(#arrow)"/>
  <path d="M 400 102 L 420 102" class="flow" marker-end="url(#arrow)"/>
  <path d="M 600 102 L 620 102" class="flow" marker-end="url(#arrow)"/>
  <text x="110" y="160" font-size="10" text-anchor="middle" class="lbl">3–10 min</text>
  <text x="310" y="160" font-size="10" text-anchor="middle" class="lbl">10–15 min</text>
  <text x="510" y="160" font-size="10" text-anchor="middle" class="lbl">10–25 min</text>
  <text x="710" y="160" font-size="10" text-anchor="middle" class="lbl">3–5 min</text>
</svg>
