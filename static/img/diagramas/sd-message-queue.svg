<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="Diagrama: message queue desacopla produtores e consumidores">
  <title>Message queue</title>
  <desc>Produtores publicam mensagens na fila; consumidores as processam de forma assíncrona e independente.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .store{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .ring{fill:none;stroke:#d0d7de;stroke-width:2}
    .keydot{fill:#57606a}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .store{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .ring{stroke:#30363d}
      .keydot{fill:#8b949e}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="18" y="22" font-size="11" text-anchor="start" class="lbl">Fila: produtores e consumidores escalam sozinhos</text>
  <rect x="40" y="70" width="200" height="60" rx="8" class="proc"/>
  <text x="140" y="98" font-size="12" text-anchor="middle">Produtores</text>
  <text x="140" y="115" font-size="10" text-anchor="middle" class="mono">servidores web</text>
  <rect x="320" y="75" width="180" height="50" rx="8" class="store"/>
  <text x="410" y="104" font-size="12" text-anchor="middle">Fila</text>
  <rect x="580" y="70" width="160" height="60" rx="8" class="proc"/>
  <text x="660" y="98" font-size="12" text-anchor="middle">Consumidores</text>
  <text x="660" y="115" font-size="10" text-anchor="middle" class="mono">workers</text>
  <path d="M 240 100 L 320 100" class="flow" marker-end="url(#arrow)"/>
  <text x="280" y="92" font-size="10" text-anchor="middle" class="lbl">publica</text>
  <path d="M 500 100 L 580 100" class="flow" marker-end="url(#arrow)"/>
  <text x="540" y="92" font-size="10" text-anchor="middle" class="lbl">consome</text>
</svg>
