<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 280" role="img" aria-label="Diagrama: scheduler GMP com work stealing">
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .core{fill:none;stroke:#238636;stroke-width:2}
    .lbl{fill:#57606a}
    .arrow{stroke:#0969da;stroke-width:2;fill:none}
    .dash{stroke:#b35900;stroke-width:1.5;fill:none;stroke-dasharray:6 5}
    .head{fill:#0969da;stroke:none}
    .dhead{fill:#b35900;stroke:none}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .core{stroke:#3fb950}
      .lbl{fill:#8b949e}
      .arrow{stroke:#58a6ff}
      .head{fill:#58a6ff}
      .dash{stroke:#d29922}
      .dhead{fill:#d29922}
    }
  </style>
  <defs>
    <marker id="ah16" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" class="head"/>
    </marker>
    <marker id="ah17" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" class="dhead"/>
    </marker>
  </defs>
  <text x="30" y="35" font-size="14" class="lbl">G · goroutines</text>
  <rect x="30" y="50" width="140" height="42" rx="8" class="box"/>
  <text x="46" y="77" font-size="14">g1 g2 g3</text>
  <rect x="30" y="100" width="140" height="42" rx="8" class="box"/>
  <text x="46" y="127" font-size="14">g4 g5</text>
  <text x="30" y="168" font-size="13" class="lbl">runqueue local</text>
  <line x1="175" y1="95" x2="240" y2="110" class="arrow" marker-end="url(#ah16)"/>
  <text x="30" y="45" font-size="1" class="lbl"></text>
  <text x="250" y="35" font-size="14" class="lbl">P · GOMAXPROCS</text>
  <rect x="250" y="80" width="110" height="55" rx="8" class="box"/>
  <text x="266" y="113" font-size="15" font-weight="bold">P0</text>
  <rect x="250" y="160" width="110" height="55" rx="8" class="box"/>
  <text x="266" y="193" font-size="15" font-weight="bold">P1</text>
  <path d="M 250 188 C 215 188 215 142 250 142" class="dash" marker-end="url(#ah17)"/>
  <text x="30" y="250" font-size="13" class="lbl">P ocioso rouba da fila alheia (work stealing)</text>
  <line x1="365" y1="107" x2="430" y2="107" class="arrow" marker-end="url(#ah16)"/>
  <line x1="365" y1="187" x2="430" y2="187" class="arrow" marker-end="url(#ah16)"/>
  <text x="440" y="35" font-size="14" class="lbl">cores (M = thread)</text>
  <rect x="440" y="80" width="190" height="55" rx="8" class="core"/>
  <text x="456" y="113" font-size="15">CPU 0</text>
  <rect x="440" y="160" width="190" height="55" rx="8" class="core"/>
  <text x="456" y="193" font-size="15">CPU 1</text>
</svg>
