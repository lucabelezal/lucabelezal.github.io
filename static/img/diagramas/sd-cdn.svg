<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="Diagrama: CDN entrega conteúdo estático do servidor mais próximo do usuário">
  <title>Content delivery network</title>
  <desc>O cliente busca o conteúdo estático na CDN; se não houver cache, a CDN busca na origem e passa a servir.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .store{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .ring{fill:none;stroke:#d0d7de;stroke-width:2}
    .keydot{fill:#57606a}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .store{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .ring{stroke:#30363d}
      .keydot{fill:#8b949e}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="18" y="22" font-size="11" text-anchor="start" class="lbl">CDN: conteúdo estático perto do usuário</text>
  <rect x="40" y="60" width="150" height="50" rx="8" class="box"/>
  <text x="115" y="89" font-size="12" text-anchor="middle">Cliente A</text>
  <rect x="40" y="160" width="150" height="50" rx="8" class="box"/>
  <text x="115" y="189" font-size="12" text-anchor="middle">Cliente B</text>
  <rect x="300" y="100" width="160" height="60" rx="8" class="proc"/>
  <text x="380" y="128" font-size="12" text-anchor="middle">CDN</text>
  <text x="380" y="145" font-size="10" text-anchor="middle" class="mono">30 ms</text>
  <rect x="560" y="100" width="170" height="60" rx="8" class="store"/>
  <text x="645" y="128" font-size="12" text-anchor="middle">Origem</text>
  <text x="645" y="145" font-size="10" text-anchor="middle" class="mono">120 ms</text>
  <path d="M 190 85 L 300 115" class="flow" marker-end="url(#arrow)"/>
  <path d="M 190 185 L 300 145" class="flow" marker-end="url(#arrow)"/>
  <path d="M 460 130 L 560 130" class="flow" marker-end="url(#arrow)"/>
  <text x="510" y="122" font-size="10" text-anchor="middle" class="lbl">miss</text>
</svg>
