<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-label="Diagrama: tudo num servidor único — usuário resolve o DNS e fala com o servidor, que guarda app, banco e cache">
  <title>Servidor único</title>
  <desc>O usuário resolve o domínio no DNS e envia a requisição HTTP a um único servidor, que hospeda aplicação, banco e cache.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#0969da;stroke-width:2}
    .store{fill:none;stroke:#d29922;stroke-width:2}
    .proc{fill:none;stroke:#8957e5;stroke-width:2}
    .flow{fill:none;stroke:#0969da;stroke-width:1.6}
    .ring{fill:none;stroke:#d0d7de;stroke-width:2}
    .keydot{fill:#57606a}
    .lbl{fill:#57606a}
    .mono{fill:#57606a}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#58a6ff}
      .store{stroke:#e3b341}
      .proc{stroke:#a371f7}
      .flow{stroke:#58a6ff}
      .ring{stroke:#30363d}
      .keydot{fill:#8b949e}
      .lbl{fill:#8b949e}
      .mono{fill:#8b949e}
    }
  </style>
  <text x="18" y="22" font-size="11" text-anchor="start" class="lbl">Tudo num servidor: app, banco e cache</text>
  <rect x="18" y="90" width="140" height="60" rx="8" class="box"/>
  <text x="88" y="118" font-size="12" text-anchor="middle">Usuário</text>
  <text x="88" y="135" font-size="10" text-anchor="middle" class="mono">browser · mobile</text>
  <rect x="210" y="90" width="140" height="60" rx="8" class="proc"/>
  <text x="280" y="124" font-size="12" text-anchor="middle">DNS</text>
  <rect x="430" y="90" width="300" height="60" rx="8" class="box"/>
  <text x="580" y="118" font-size="12" text-anchor="middle">Servidor único</text>
  <text x="580" y="135" font-size="10" text-anchor="middle" class="mono">app web · banco · cache</text>
  <path d="M 158 110 L 210 110" class="flow" marker-end="url(#arrow)"/>
  <text x="184" y="102" font-size="10" text-anchor="middle" class="lbl">1</text>
  <path d="M 210 130 L 158 130" class="flow" marker-end="url(#arrow)"/>
  <text x="184" y="148" font-size="10" text-anchor="middle" class="lbl">2 IP</text>
  <path d="M 88 150 L 88 190 L 580 190 L 580 150" class="flow" marker-end="url(#arrow)"/>
  <text x="334" y="206" font-size="10" text-anchor="middle" class="lbl">3 HTTP → 4 HTML/JSON</text>
</svg>
