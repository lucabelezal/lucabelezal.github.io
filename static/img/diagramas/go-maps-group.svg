      .live{stroke:#58a6ff}
      .emp{stroke:#8b949e}
      .del{stroke:#d29922}
      .lbl{fill:#8b949e}
      .arrow{stroke:#58a6ff}
      .head{fill:#58a6ff}
    }
  </style>
  <defs>
