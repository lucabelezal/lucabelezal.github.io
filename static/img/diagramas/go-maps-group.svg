<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 300" role="img" aria-label="Diagrama: grupo com control bytes e slots">
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .live{fill:none;stroke:#0969da;stroke-width:2}
    .emp{fill:none;stroke:#57606a;stroke-width:1.5;stroke-dasharray:5 4}
    .del{fill:none;stroke:#b35900;stroke-width:2}
    .lbl{fill:#57606a}
    .arrow{stroke:#0969da;stroke-width:1.5;fill:none}
    .head{fill:#0969da;stroke:none}
