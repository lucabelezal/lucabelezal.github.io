<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 340" role="img" aria-label="Diagrama: arquitetura AWS heterogênea com clientes, adaptadores primários, domínio e adaptadores secundários">
  <title>Arquitetura AWS heterogênea</title>
  <desc>Clientes (API Gateway, SQS, EventBridge) chamam adaptadores primários (Lambda, ECS com Fargate); o domínio usa adaptadores secundários (DynamoDB, RDS, S3).</desc>
  <style>
    text{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;fill:#24292f}
    .box{fill:none;stroke:#8957e5;stroke-width:2}
    .primary{fill:none;stroke:#0969da;stroke-width:2}
    .domain{fill:none;stroke:#238636;stroke-width:2}
    .data{fill:none;stroke:#d29922;stroke-width:2}
    .lbl{fill:#57606a}
    .arrow{stroke:#57606a;stroke-width:2;fill:none}
    .head{fill:#57606a;stroke:none}
    @media (prefers-color-scheme: dark){
      text{fill:#e6edf3}
      .box{stroke:#a371f7}
      .primary{stroke:#58a6ff}
      .domain{stroke:#3fb950}
      .data{stroke:#e3b341}
      .lbl{fill:#8b949e}
      .arrow{stroke:#8b949e}
      .head{fill:#8b949e}
    }
  </style>
  <defs>
    <marker id="awsArqHead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" class="head"/>
    </marker>
  </defs>
  <text x="18" y="24" font-size="13" class="lbl">Arquitetura heterogênea: cada peça no serviço certo</text>

  <rect x="20" y="70" width="170" height="220" rx="10" class="box"/>
  <text x="36" y="95" font-size="13" font-weight="bold">Clientes</text>
  <rect x="36" y="110" width="138" height="48" rx="8" class="box"/>
  <text x="48" y="140" font-size="12">API Gateway</text>
  <rect x="36" y="170" width="138" height="48" rx="8" class="box"/>
  <text x="48" y="200" font-size="12">SQS</text>
  <rect x="36" y="230" width="138" height="48" rx="8" class="box"/>
  <text x="48" y="260" font-size="12">EventBridge</text>

  <rect x="250" y="70" width="190" height="220" rx="10" class="primary"/>
  <text x="266" y="95" font-size="13" font-weight="bold">Primários</text>
  <rect x="266" y="110" width="158" height="60" rx="8" class="primary"/>
  <text x="278" y="138" font-size="13">Lambda</text>
  <text x="278" y="158" font-size="11" class="lbl">função</text>
  <rect x="266" y="190" width="158" height="60" rx="8" class="primary"/>
  <text x="278" y="218" font-size="13">ECS + Fargate</text>
  <text x="278" y="238" font-size="11" class="lbl">contêiner</text>

  <rect x="490" y="140" width="150" height="90" rx="10" class="domain"/>
  <text x="565" y="180" font-size="15" font-weight="bold" text-anchor="middle">Domínio</text>
  <text x="565" y="204" font-size="11" class="lbl" text-anchor="middle">regras de negócio</text>

  <rect x="690" y="70" width="130" height="220" rx="10" class="data"/>
  <text x="704" y="95" font-size="13" font-weight="bold">Secundários</text>
  <rect x="704" y="110" width="102" height="48" rx="8" class="data"/>
  <text x="716" y="140" font-size="12">DynamoDB</text>
  <rect x="704" y="170" width="102" height="48" rx="8" class="data"/>
  <text x="716" y="200" font-size="12">RDS</text>
  <rect x="704" y="230" width="102" height="48" rx="8" class="data"/>
  <text x="716" y="260" font-size="12">S3</text>

  <line x1="190" y1="180" x2="250" y2="180" class="arrow" marker-end="url(#awsArqHead)"/>
  <line x1="440" y1="180" x2="490" y2="180" class="arrow" marker-end="url(#awsArqHead)"/>
  <line x1="640" y1="180" x2="690" y2="180" class="arrow" marker-end="url(#awsArqHead)"/>

  <text x="18" y="320" font-size="12" class="lbl">O domínio define portas; os adaptadores implementam. Trocar DynamoDB por RDS não mexe na regra.</text>
</svg>
